name: Build Android App Bundle (Google Play)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Play (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Bundle fonts offline
        run: node scripts/vendor-fonts.mjs || echo "::warning::Fonts could not be bundled; the app will load them online."

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npm run android:assets

      - name: Sync web app and plugins
        run: npx cap sync android

      - name: Prepare release (API 36, version, signing)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
        run: node scripts/prepare-android.mjs

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks

      - name: Build signed AAB and APK
        working-directory: android
        env:
          IQRA_KEYSTORE_FILE: upload.jks
          IQRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IQRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IQRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/iqra-island-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk out/iqra-island-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iqra-island-release-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
