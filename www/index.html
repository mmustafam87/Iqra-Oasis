      status(a===0?"Bismillāh…":`Āyah ${a}${reps>1?` · time ${r} of ${reps}`:""}${QPREF.rate<1?" · slow":""}`);

const EXAMS=[
 {id:"letters",emo:"🔤",name:"Letters Exam",desc:"Sounds, names and shapes of the letters you've learnt.",c:"#ff6f59"},
 {id:"dots",emo:"🔍",name:"Dots & Shapes Exam",desc:"Look-alike letters, dots and letter forms.",c:"#7b4fd6"},
 {id:"vowels",emo:"🎵",name:"Vowels Exam",desc:"Fatḥa, kasra, ḍamma, sukūn and shadda.",c:"#14b8c4"},
 {id:"words",emo:"📚",name:"Words Exam",desc:"Read and hear Arabic words.",c:"#e09a00"},
 {id:"quran",emo:"🌿",name:"Qur'an Exam",desc:"Which surah is it? What does it mean?",c:"#2f9e58"},
 {id:"prophets",emo:"⭐",name:"Prophets Exam",desc:"Questions from the Prophets' Stories.",c:"#2b5fb3"},
 {id:"hajj",emo:"🕋",name:"Ḥajj & ʿUmrah Exam",desc:"Ṭawāf, saʿī, ʿArafah and the days of Ḥajj.",c:"#16324a"},
 {id:"manners",emo:"🤲",name:"Muslim Manners Exam",desc:"What do we say, and when?",c:"#a8541f"},
];
function examQuestions(id){
  const ls=uniq(arcadeLetters());const pool=LETTERS.map(x=>x.ar);const N=AGE().id==="seeds"?6:10;
  const R=n=>Array.from({length:n});
  if(id==="letters")return R(N).map((_,i)=>{const a=pick(ls);return[qListenLetter,qNameLetter,qPicture][i%3](a,ls)});
  if(id==="dots")return R(N).map((_,i)=>{const a=pick(pool);const[d]=DOTS[a];
    if(i%2===0){const opts=shuffle([d,...shuffle([0,1,2,3].filter(x=>x!==d)).slice(0,NOPT())]);return{prompt:`How many dots does <span class="ar" style="font-size:1.4em">${a}</span> have?`,answer:String(d),letter:a,options:opts.map(o=>({key:String(o),html:`<b style="font-size:46px;font-family:var(--f-display)">${o}</b>`}))}}
    const x=pick(LETTERS.filter(y=>y.join));const form=x.ar+ZWJ;return{prompt:"Which letter starts this word?",show:`<div class="wordcard" style="padding:6px 34px"><div class="ar" style="font-size:84px">${form}</div></div>`,answer:x.ar,letter:x.ar,options:shuffle([x.ar,...distractors(x.ar,pool,NOPT())]).map(o=>({key:o,html:optAr(o)}))}});
  if(id==="vowels")return R(N).map((_,i)=>{const a=pick(HL);
    if(i%3===2){const t=pick(SHADDA.concat(SUKUN));return qSyl({...t,say:t.ar},SHADDA.concat(SUKUN))}
    const all=["fatha","kasra","damma"].map(h=>({ar:a+HARAKAT[h].mark,tr:syl(a,HARAKAT[h].snd),say:a+HARAKAT[h].mark,letter:a}));return qSyl(pick(all),all)});
  if(id==="words"){const sets=Object.entries(WORDS).filter(([k])=>k!=="phrases").map(([,v])=>v);return R(N).map((_,i)=>{const set=pick(sets),w=pick(set);return i%2?qReadPic(w,set):qHearPic(w,set)})}
  if(id==="quran")return R(N).map((_,i)=>{const s=pick(SURAHS);const others=shuffle(SURAHS.filter(x=>x!==s)).slice(0,NOPT());const t=i%3;
    if(t===0){const a=pick(s.ayat);return{prompt:"Listen! Which surah is this āyah from?",audio:[s.n,a.a],answer:String(s.n),options:shuffle([s,...others]).map(o=>({key:String(o.n),html:`<span class="ar quran" style="font-size:30px">${o.nameAr}</span><small>${esc(o.nameEn)}</small>`}))}}
    if(t===1){const a=pick(s.ayat);const wrong=shuffle(SURAHS.flatMap(x=>x.ayat).filter(x=>x!==a)).slice(0,NOPT());return{prompt:"What does this āyah mean?",show:`<div class="wordcard" style="padding:6px 22px"><div class="quran" style="font-size:30px;line-height:1.9">${a.text}</div></div>`,audio:[s.n,a.a],answer:a.meaning,options:shuffle([a,...wrong]).map(o=>({key:o.meaning,html:`<b style="font-size:16px;line-height:1.3">${esc(o.meaning)}</b>`}))}}
    return{prompt:`What does the name <b>${esc(s.nameEn)}</b> mean?`,answer:s.meaningEn,options:shuffle([s,...others]).map(o=>({key:o.meaningEn,html:optText(o.meaningEn)}))}});
  if(id==="prophets"){const all=PROPHETS.flatMap(p=>p.quiz.map(q=>({p,q})));return shuffle(all).slice(0,N).map(({p,q:[qq,a,w]})=>({prompt:`<small style="display:block;font-size:.6em;color:var(--ink-soft)">Prophet ${esc(p.name)}</small>${esc(qq)}`,speakEn:qq,answer:a,options:shuffle([a,...w.slice(0,NOPT())]).map(o=>({key:o,html:optText(o)}))}))}
  if(id==="manners"){const ps=WORDS.phrases;return R(Math.min(N,8)).map((_,i)=>{const p=pick(ps);const others=shuffle(ps.filter(x=>x!==p)).slice(0,NOPT());
    return i%2?{prompt:`What do we say ${esc(p.when)}?`,answer:p.ar,options:shuffle([p,...others]).map(o=>({key:o.ar,html:`<span class="ar" style="font-size:30px">${o.ar}</span><small>${esc(o.tr)}</small>`}))}
      :{prompt:"What does this mean?",speakAr:p.ar,show:`<div class="wordcard" style="padding:6px 22px"><div class="ar" style="font-size:40px">${p.ar}</div>${trBit(p.tr)}</div>`,answer:p.en,options:shuffle([p,...others]).map(o=>({key:o.en,html:optText(o.en)}))}})}
  if(id==="hajj")return hajjQuiz(N);
  return[];
}

  const k=kid();const L=dayLog(k);const cap=S().examCap;const left=Math.max(0,cap-(L.paidExams||0));
  APP().innerHTML=`${topbar({title:"Exam Hall",sub:"Pass exams to earn gold dinars",back:true})}<div class="scene"><div class="wrap">
    ${speechHTML(`Each right answer earns <b>2 gold dinars</b>, and a perfect score earns a <b>+5 bonus</b>! ${left?`You can earn dinars from <b>${left} more exam${left===1?"":"s"}</b> today.`:"You've earned all your exam dinars for today. You can still practise!"}`,"happy",70)}
    <div class="games">${EXAMS.map(e=>{const best=Math.max(-1,...(k.exams||[]).filter(x=>x.id===e.id).map(x=>Math.round(x.score/x.n*100)));
      return `<button class="game" data-ex="${e.id}" style="--gc:${e.c}"><span class="em">${e.emo}</span><b>${e.name}</b><small>${e.desc}</small><span class="best">${best>=0?`🏅 Best ${best}%`:"Not taken yet"}</span></button>`}).join("")}</div>
  </div></div>`;

function startExam(id){
  const e=EXAMS.find(x=>x.id===id);const k=kid();const qs=examQuestions(id);let right=0;
  if(!qs.length){toast("This exam isn't ready yet.");return}
  const steps=[["info",{speech:`<b>${esc(e.name)}</b>: ${qs.length} questions. One try each. Bismillāh!`,title:`${e.emo} ${esc(e.name)}`,nextLabel:"Start the exam",intro:`${e.name}. ${qs.length} questions. Bismillah!`}],...qs.map(q=>["quizq",{q,onAnswer:ok=>{if(ok)right++}}])];
  runSteps({title:e.name,onExit:()=>go("exams"),steps,onFinish:()=>{
    const L=dayLog(k);const paid=(L.paidExams||0)<S().examCap;const pct=Math.round(right/qs.length*100);
    const earn=paid?right*2+(right===qs.length?5:0):0;if(paid)L.paidExams=(L.paidExams||0)+1;
    (k.exams=k.exams||[]).push({d:Date.now(),id,name:e.name,score:right,n:qs.length});logAct("exams");save();
    const grade=pct>=90?["🥇","Excellent! Mumtāz!"]:pct>=70?["🥈","Very good! Jayyid jiddan!"]:pct>=50?["🥉","Good try! Keep practising."]:["💪","Keep learning, you'll get there!"];
    const el=$(".stage");el.innerHTML=`<div class="act" style="margin:auto">${speechHTML(`You scored <b>${right} / ${qs.length}</b> (${pct}%). ${grade[1]}`,pct>=70?"wow":"think",90)}<div style="font-size:110px">${grade[0]}</div>
      ${earn?`<div class="earn">+${earn} <span class="pearl"></span> gold dinars</div>`:paid?"":`<p class="sub">Practice round: no dinars (today's exam rewards are used up).</p>`}
      <div class="row center"><button class="btn coral" data-again>↺ Try again</button><button class="btn sun" data-b>🏛️ Exam Hall</button></div></div>`;
    if(earn)pearls(earn,`Exam: ${e.name} (${right}/${qs.length})`);confetti(pct>=70?160:40);if(pct>=70)SFX.fanfare();
    $("[data-again]").onclick=()=>startExam(id);$("[data-b]").onclick=()=>go("exams");
    sayEn(`You scored ${right} out of ${qs.length}. ${grade[1]}`);
  }});
}

// ================= GAME MUSIC: daf (دف) rhythm + optional hummed nasheed melody =================
// Everything is synthesised: a frame drum (dum / tak / ka + jingles) playing the Maqsum rhythm,
// and a soft "ooh" voice humming an original tune in Maqam Ḥijāz. No recordings, no other instruments.
const MUSIC_MODES=["daf+hum","daf","fx","off"];
const MUSIC_LABEL={"daf+hum":"Daf + nasheed hum","daf":"Daf only","fx":"Sound effects only","off":"Sound off"};
const Music={step:0,next:0,noise:null,
  mode(){const m=DB.settings.gameMusic;return MUSIC_MODES.includes(m)?m:(S().sfx?"daf+hum":"off")},
  setMode(m){DB.settings.gameMusic=m;save()},
  cycle(){const i=MUSIC_MODES.indexOf(this.mode());this.setMode(MUSIC_MODES[(i+1)%MUSIC_MODES.length]);return this.mode()},
  fxOn(){return this.mode()!=="off"},
  buf(c){if(!this.noise){const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=b}return this.noise},
  hit(c,t,kind){try{const out=c.destination;
    if(kind==="dum"){const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(52,t+.22);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g).connect(out);o.start(t);o.stop(t+.4);
      const s=c.createBufferSource(),f=c.createBiquadFilter(),g2=c.createGain();s.buffer=this.buf(c);f.type="lowpass";f.frequency.value=420;g2.gain.setValueAtTime(.16,t);g2.gain.exponentialRampToValueAtTime(.0001,t+.12);s.connect(f).connect(g2).connect(out);s.start(t,0,.15)}
    else{const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.buf(c);f.type="bandpass";f.frequency.value=kind==="tak"?3200:2400;f.Q.value=1.4;const v=kind==="tak"?.22:.1;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+(kind==="tak"?.09:.06));s.connect(f).connect(g).connect(out);s.start(t,Math.random()*.3,.12);
      const o=c.createOscillator(),g3=c.createGain();o.type="triangle";o.frequency.setValueAtTime(kind==="tak"?720:560,t);g3.gain.setValueAtTime(kind==="tak"?.05:.025,t);g3.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g3).connect(out);o.start(t);o.stop(t+.06)}
    if(kind!=="ka"){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.buf(c);f.type="highpass";f.frequency.value=6500;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);s.connect(f).connect(g).connect(out);s.start(t+.005,Math.random()*.3,.2)}}catch(e){}},
  hum(c,t,freq,dur){try{const out=c.destination,g=c.createGain(),lp=c.createBiquadFilter(),bp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1300;bp.type="peaking";bp.frequency.value=480;bp.gain.value=8;bp.Q.value=1.2;

function smEngine(k){

/* ---------- level builder ---------- */

function tileAt(tx,ty){if(tx<0||tx>=L.cols||ty<0||ty>=ROWS)return 0;return L.g[ty][tx]}
function solidAt(tx,ty){if(tx<0||tx>=L.cols)return true;if(ty<0||ty>=ROWS)return false;const t=L.g[ty][tx];return t>=1&&t<=6}

let skyGrad=null,farB=[],midB=[],clouds=[];

function waterSound(){if(!S().sfx)return;const c=ac();if(!c)return;try{const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=Music.buf(c);f.type="bandpass";f.frequency.value=1800+Math.random()*800;f.Q.value=.8;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime,Math.random()*.2,.5)}catch(e){}}
function prayerReward(id,n){const k=kid();k.prayerDone=k.prayerDone||{};const first=!k.prayerDone[id];k.prayerDone[id]=Date.now();logAct("stories");save();const earn=first?n:1;pearls(earn,{wudu:"Learnt wuḍūʾ",salah:"Learnt ṣalāh"}[id]||"Prayer game");return earn}

ACT.order=(el,{items,prompt,hint},api)=>{
  const bank=shuffle(items.map((it,i)=>({...it,i})));let at=0,first=true;
  el.innerHTML=`<div class="act"><div class="prompt">${prompt}</div>${hint?`<p class="sub">${hint}</p>`:""}
    <div class="orderslots">${items.map((_,i)=>`<div class="oslot ${i===0?"next":""}" data-s="${i}"><b>${i+1}</b></div>`).join("")}</div>
    <div class="orderbank">${bank.map((b,j)=>`<button class="ocard" data-k="${j}">${b.html}</button>`).join("")}</div></div>`;
  $$(".ocard",el).forEach(c=>c.onclick=()=>{const b=bank[+c.dataset.k];
    if(b.i===at){c.classList.add("used");const s=$(`[data-s="${at}"]`,el);s.innerHTML=`<b>${at+1}</b>${b.html}`;s.classList.add("fill");s.classList.remove("next");SFX.pop();at++;const nx=$(`[data-s="${at}"]`,el);if(nx)nx.classList.add("next");
      if(at===items.length){api.hit(null,first);SFX.good();praise();confetti(80);setTimeout(api.next,1200)}}
    else{c.classList.remove("bad");void c.offsetWidth;c.classList.add("bad");SFX.bad();if(first)api.miss(null);first=false}});
};
function prayerGame(id){
  const back=()=>go("prayer");let right=0;
  const done=(n)=>({miss})=>{const earn=prayerReward(id,n);const el=$(".stage");el.innerHTML=`<div class="act" style="margin:auto">${speechHTML(miss<=1?"Mā shāʾ Allāh! Perfect!":"Well done! Keep practising.","wow",90)}<div class="earn">+${earn} <span class="pearl"></span> gold dinars</div><div class="row center"><button class="btn coral" data-a>↺ Play again</button><button class="btn sun" data-b>⬅ Back</button></div></div>`;confetti(100);SFX.fanfare();$("[data-a]").onclick=()=>prayerGame(id);$("[data-b]").onclick=back};
  if(id==="g-wudu")return runSteps({title:"Wuḍūʾ in Order",onExit:back,steps:[["order",{prompt:"Put the steps of wuḍūʾ in order",hint:"Tap the first step, then the next…",items:WUDU.map(w=>({html:`<span class="oe">${w.e}</span><small>${esc(w.n)}</small>`}))}]],onFinish:done(5)});
  if(id==="g-salah"){const seq=SALAH.filter(s=>["takbir","qiyam","ruku","itidal","sujud","jalsa","sujud2"].includes(s.id));
    return runSteps({title:"Ṣalāh in Order",onExit:back,steps:[["order",{prompt:"Put one rakʿah in order",hint:"Start with the takbīr: Allāhu akbar!",items:seq.map(s=>({html:`${poseSVG(s.pose,74)}<small>${esc(s.n.replace(/ \(.*\)/,""))}</small>`}))}]],onFinish:done(5)})}
  if(id==="g-say"){const pool=SALAH.filter(s=>!["niyyah","sujud2"].includes(s.id));
    const qs=shuffle(pool).slice(0,6).map(s=>({prompt:`What do we say in <b>${esc(s.n)}</b>?`,show:`<div class="wordcard" style="padding:4px 16px">${poseSVG(s.pose,150)}</div>`,answer:s.ar,
      options:shuffle([s,...shuffle(pool.filter(x=>x.ar!==s.ar)).slice(0,NOPT())]).map(o=>({key:o.ar,html:`<span class="ar" style="font-size:24px;line-height:1.7">${o.ar}</span><small>${esc(o.tr)}</small>`}))}));
    return runSteps({title:"What Do We Say?",onExit:back,steps:qs.map(q=>["quizq",{q,onAnswer:ok=>{if(ok)right++}}]),onFinish:r=>done(5)({miss:qs.length-right})})}
  if(id==="g-times"){const qs=[];shuffle(PRAYERS).forEach((p,j)=>{const others=shuffle(PRAYERS.filter(x=>x!==p)).slice(0,NOPT());
      qs.push(j%2?{prompt:`Which prayer do we pray <b>${esc(p.when)}</b>? ${p.e}`,answer:p.n,options:shuffle([p,...others]).map(o=>({key:o.n,html:`<span class="ar" style="font-size:30px">${o.ar}</span><small>${esc(o.n)}</small>`}))}
        :{prompt:`How many rakʿahs are in <b>${esc(p.n)}</b>? ${p.e}`,answer:String(p.r),options:shuffle([...new Set([p.r,2,3,4])]).slice(0,Math.max(2,AGE().opts)).concat([]).filter((v,i,a)=>a.indexOf(v)===i).map(o=>({key:String(o),html:`<b style="font-size:46px;font-family:var(--f-display)">${o}</b>`}))})});
    qs.forEach(q=>{if(!q.options.some(o=>o.key===q.answer))q.options[0]={key:q.answer,html:`<b style="font-size:46px;font-family:var(--f-display)">${q.answer}</b>`};q.options=shuffle(q.options)});
    return runSteps({title:"Prayer Times",onExit:back,steps:qs.map(q=>["quizq",{q,onAnswer:ok=>{if(ok)right++}}]),onFinish:()=>done(5)({miss:qs.length-right})})}
}

  if(earn)pearls(earn,`Bonus: ${G.name}`);confetti(nb?140:70);if(nb&&score>0)SFX.fanfare();
  const m=modal(`<div style="font-size:64px">${G.emo}</div><h3>${nb&&score>0?"New best score!":"Great game!"}</h3>${extra}<p style="font-weight:800;font-size:20px">Score: <b>${score}</b></p>${earn?`<div class="earn" style="justify-content:center">+${earn} <span class="pearl"></span> bonus dinars</div>`:""}

// ---------------------------------------------------------------- FIND IT! (hidden objects)
const FIND_EXTRA=["🔑","🧦","⚽","🍎","🐞","🦋","⏰","🧸","🪁","🍌","🐸","🎩","🥥","🦉","🐌","🧲","🍋","🌂","🐝","🍓"];
SCREENS.fp_find=()=>{
  window.__inGame=true;const age=AGE().id;const NT={seeds:4,explorers:5,adventurers:6,scholars:7}[age]||5;const rounds=age==="seeds"?2:3;const tilt=age==="adventurers"||age==="scholars";
  let round=0,total=0,miss=0,clock=null,t0=Date.now();CLEAN.push(()=>clearInterval(clock));const order=shuffle(SPOT_SCENES);
  function play(){
    const sc=order[round%order.length];const pool=uniq([...sc.pool,...FIND_EXTRA]);let targets=shuffle(pool).slice(0,NT);const rest=pool.filter(e=>!targets.includes(e));
    const objs=[],want=[...targets];const N=NT+(age==="seeds"?10:18);let tries=0;
    while(objs.length<N&&tries++<3000){const s=age==="seeds"?30+Math.random()*8:20+Math.random()*12;const x=18+Math.random()*364,y=24+Math.random()*262;
      if(objs.every(o=>Math.hypot(o.x-x,o.y-y)>(o.s+s)*.55)){const e=want.length?want.shift():pick(rest);objs.push({x,y,s,e,t:targets.includes(e),rot:tilt?(Math.random()-.5)*70:0})}}
    targets=targets.filter(e=>objs.some(o=>o.e===e));let found=0,hints=2;
    APP().innerHTML=`${topbar({title:"Find It!",sub:`${sc.name} · picture ${round+1} of ${rounds}`,back:true})}<div class="scene"><div class="wrap spwrap">
      <div class="sphud"><div class="fdlist">${targets.map(e=>`<span class="fdt" data-e="${e}">${e}</span>`).join("")}</div><span class="hchip2">⏱ <b data-t>0</b>s</span><button class="btn ghost small" data-hint>💡 Hint (<b data-h>2</b>)</button></div>
      <svg class="spsvg fdsvg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">${sc.bg}${objs.map(o=>`<text x="${o.x}" y="${o.y}" font-size="${o.s}" text-anchor="middle" dominant-baseline="central" class="spemo"${o.rot?` transform="rotate(${o.rot.toFixed(0)} ${o.x.toFixed(1)} ${o.y.toFixed(1)})"`:""}>${o.e}</text>`).join("")}<g class="spmarks"></g></svg>
      <p class="sub" style="text-align:center;margin:0 auto">Find every thing in the list at the top. Each one is hiding <b>once</b> in the picture!</p>
    </div></div>`;
    wireTop(async()=>{if(await ask("Leave the game?","Your score won't be saved.","Leave","Keep playing"))go("funpark")});
    clearInterval(clock);t0=Date.now();clock=setInterval(()=>{const t=$("[data-t]");if(t)t.textContent=(Date.now()-t0)/1000|0},500);
    const s=$(".fdsvg"),g=$(".spmarks",s);
    const ring=(o,cls,ms)=>{const c=document.createElementNS(svgNS,"circle");c.setAttribute("cx",o.x);c.setAttribute("cy",o.y);c.setAttribute("r",o.s*.7+6);c.setAttribute("class",cls);g.appendChild(c);if(ms)setTimeout(()=>c.remove(),ms)};
    s.addEventListener("pointerdown",e=>{e.preventDefault();const p=svgPt(s,e);if(!p)return;
      const hit=objs.map(o=>({o,d:Math.hypot(o.x-p.x,o.y-p.y)})).filter(q=>q.d<q.o.s*.6+8).sort((a,b)=>a.d-b.d)[0];
      if(hit&&hit.o.t&&!hit.o.found){const o=hit.o;o.found=true;found++;total++;ring(o,"spmark");SFX.good();const chip=$(`[data-e="${o.e}"]`);if(chip)chip.classList.add("done");
        if(found===targets.length){clearInterval(clock);praise();confetti(90);setTimeout(()=>{round++;if(round<rounds)play();else fpFinish("find",total,`<p style="font-weight:700">You found <b>${total}</b> hidden things${miss?` (${miss} wrong tap${miss>1?"s":""})`:" with no wrong taps"}!</p>`)},1200)}}
      else{miss++;SFX.bad();const x=document.createElementNS(svgNS,"text");x.setAttribute("x",p.x);x.setAttribute("y",p.y);x.setAttribute("class","spx");x.setAttribute("text-anchor","middle");x.setAttribute("dominant-baseline","central");x.textContent="✖";g.appendChild(x);setTimeout(()=>x.remove(),600)}});
    $("[data-hint]").onclick=()=>{if(hints<=0){toast("No hints left for this picture!");return}const o=objs.find(o=>o.t&&!o.found);if(!o)return;hints--;$("[data-h]").textContent=hints;ring(o,"sphint",1600);SFX.tap()};
    sayEn(`Find ${targets.length} hidden things!`);
  }
  play();
};

  function update(dt){t+=dt;if(flash>0)flash-=dt*3;
    if(mode==="play"&&cur){cur.x+=cur.dir*cur.v*dt;if(cur.x>XM-cur.w){cur.x=XM-cur.w;cur.dir=-1}if(cur.x<-XM){cur.x=-XM;cur.dir=1}}
    deb.forEach(d=>{d.vy+=900*dt;d.y-=d.vy*dt/LH;d.x+=d.vx*dt;d.rot+=d.vr*dt});deb=deb.filter(d=>d.y>-40);
    const target=Math.max(0,(L.length-7)*LH);cam+=(target-cam)*Math.min(1,dt*4);

  function block(x,y,w,i,alpha=1,rot=0){const gy=H-60;const sx=W/2+x*sc,sy=gy-(y+1)*LH*sc+cam*sc,ww=w*sc,hh=LH*sc,d=7*sc;
    ctx.save();ctx.globalAlpha=alpha;if(rot){ctx.translate(sx+ww/2,sy+hh/2);ctx.rotate(rot);ctx.translate(-(sx+ww/2),-(sy+hh/2))}

    ctx.fillStyle=c[1];ctx.beginPath();ctx.moveTo(sx+ww,sy);ctx.lineTo(sx+ww+d,sy-d);ctx.lineTo(sx+ww+d,sy+hh-d);ctx.lineTo(sx+ww,sy+hh);ctx.fill();

    ctx.fillStyle=c[0];ctx.fillRect(sx,sy,ww,hh);ctx.strokeStyle="rgba(0,0,0,.18)";ctx.lineWidth=1;ctx.strokeRect(sx,sy,ww,hh);

    else if(i%3===1&&ww>30*sc){ctx.fillStyle="#2b6fd6";const aw=Math.min(12*sc,ww*.2);const ax=sx+ww/2-aw/2;ctx.beginPath();ctx.moveTo(ax,sy+hh-3);ctx.lineTo(ax,sy+hh*.45);ctx.arc(ax+aw/2,sy+hh*.45,aw/2,Math.PI,0);ctx.lineTo(ax+aw,sy+hh-3);ctx.fill()}

    const mix=(a,b,f)=>{const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const ch=s=>Math.round(((pa>>s)&255)*(1-f)+((pb>>s)&255)*f);return`rgb(${ch(16)},${ch(8)},${ch(0)})`};
    const top=h<.5?mix("#7fd0ff","#ff9a6b",h*2):mix("#ff9a6b","#14183f",(h-.5)*2),bot=h<.5?mix("#e6f8ff","#ffd9a0",h*2):mix("#ffd9a0","#3b2f7a",(h-.5)*2);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(h>.55){ctx.fillStyle="#fff";for(let i=0;i<50;i++){ctx.globalAlpha=(h-.55)*2*(.4+(i%3)*.2);ctx.fillRect((i*97)%W,(i*61)%(H*.7),2,2)}ctx.globalAlpha=1}
    for(let i=0;i<4;i++){const cy=((i*170+cam*.3*sc)%(H+120))-60;ctx.fillStyle="rgba(255,255,255,.7)";ctx.beginPath();ctx.ellipse((i*233)%W,cy,40,14,0,0,7);ctx.ellipse((i*233)%W+30,cy-8,30,12,0,0,7);ctx.fill()}

    ctx.fillStyle="rgba(120,90,60,.35)";[[-.38,90,60],[.36,70,46],[-.2,50,30]].forEach(([fx,w,hh])=>{const x=W/2+fx*W;ctx.fillRect(x-w/2,gy-hh,w,hh);ctx.beginPath();ctx.arc(x,gy-hh,w*.28,Math.PI,0);ctx.fill()});

// ---------------------------------------------------------------- PICTURE SLIDE PUZZLE
SCREENS.fp_puzzle=()=>{
  window.__inGame=true;const age=AGE().id;const n={seeds:3,explorers:3,adventurers:4,scholars:4}[age]||3;const E=n*n-1;
  const sc=pick(SPOT_SCENES);const pic=sc.bg+spotMake(sc,0).A.map(spotObj).join("");
  let board=[...Array(n*n).keys()];let e=E,prev=-1;
  const nb=i=>{const r=i/n|0,c=i%n;return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n).map(([a,b])=>a*n+b)};
  for(let s=0;s<n*n*30;s++){const opts=nb(e).filter(x=>x!==prev);const m=pick(opts);board[e]=board[m];board[m]=E;prev=e;e=m}
  if(board.every((v,i)=>v===i)){const m=nb(e)[0];board[e]=board[m];board[m]=E;e=m}
  let moves=0,done=false;const t0=Date.now();const par=n===3?45:140;
  const tile=v=>`<svg viewBox="${(v%n)*400/n} ${(v/n|0)*300/n} ${400/n} ${300/n}" preserveAspectRatio="none">${pic}</svg>${age==="seeds"||age==="explorers"?`<span class="pzn">${v+1}</span>`:""}`;
  APP().innerHTML=`${topbar({title:"Picture Puzzle",sub:`${sc.name} · ${n}×${n}`,back:true})}<div class="scene"><div class="wrap spwrap" style="max-width:720px">
    <div class="sphud"><span class="hchip2">🔀 Moves <b data-m>0</b></span><button class="btn ghost small" data-peek>👁️ Peek</button></div>
    <div class="pzbox"><div class="pz" style="--n:${n}"></div><div class="pzfull" hidden><svg viewBox="0 0 400 300">${pic}</svg></div></div>
    <p class="sub" style="text-align:center;margin:0 auto">Tap a tile next to the empty space to slide it. Make the picture whole again!</p></div></div>`;
  wireTop(async()=>{if(done||await ask("Leave the puzzle?","Your puzzle won't be saved.","Leave","Keep going"))go("funpark")});
  const pz=$(".pz");
  function render(mv,from){pz.innerHTML=board.map((v,i)=>v===E&&!done?`<div class="pzt empty"></div>`:`<button class="pzt${mv===i?" mv":""}" data-i="${i}"${mv===i?` style="--dx:${(from%n-i%n)*100}%;--dy:${((from/n|0)-(i/n|0))*100}%"`:""}>${tile(v)}</button>`).join("");

function pinPad(title,sub,onDone,extra=""){

  const dots=()=>$$("[data-d]",m.el).forEach((d,i)=>d.classList.toggle("on",i<code.length));
  $$("[data-k]",m.el).forEach(b=>b.onclick=()=>{const v=b.dataset.k;SFX.tap();if(v==="✕"){m.close();return}if(v==="⌫"){code=code.slice(0,-1);dots();return}if(code.length<4){code+=v;dots();if(code.length===4){const r=onDone(code,m);if(r===false){code="";setTimeout(dots,150);m.el.querySelector(".modal").animate([{transform:"translateX(-10px)"},{transform:"translateX(10px)"},{transform:"none"}],{duration:300})}}}});

  if(tab)ptab=tab;const st=S();if(!pkid||!DB.kids.find(x=>x.id===pkid))pkid=DB.cur||DB.kids[0]?.id;
  const tabs=[["reports","📊 Reports"],["learners","👧 Learners"],["controls","🎛️ Controls"],["settings","⚙️ Settings"]];
  let body="";
  if(ptab==="reports")body=reportHTML();
  if(ptab==="learners")body=learnersHTML();
  if(ptab==="controls")body=controlsHTML();
  if(ptab==="settings")body=settingsHTML();
  APP().innerHTML=`${topbar({title:"Grown-ups",sub:"Reports, learners and controls",back:true})}<div class="scene"><div class="wrap" style="max-width:900px">
    <div class="ptabs">${tabs.map(([id,n])=>`<button class="${ptab===id?"on":""}" data-pt="${id}">${n}</button>`).join("")}</div>${body}</div></div>`;
  wireTop(kid()?"hub":"profiles");
  $$("[data-pt]").forEach(b=>b.onclick=()=>{ptab=b.dataset.pt;go("parents")});
  wireParents();
};
const kidById=id=>DB.kids.find(x=>x.id===id);
function lastDays(k,n=7){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;out.push({key,day:d.toLocaleDateString(undefined,{weekday:"short"}),...{min:0,gameMin:0,lessons:0,exams:0,games:0,stories:0,hifz:0,earned:0,spent:0},...((k.log||{})[key]||{})})}return out}
function reportHTML(){
  if(!DB.kids.length)return `<div class="card"><p style="font-weight:700">No learners yet. Add one in the <b>Learners</b> tab.</p></div>`;
  const k=kidById(pkid);const days=lastDays(k);const wk=days.reduce((a,d)=>({min:a.min+d.min,gameMin:a.gameMin+d.gameMin,lessons:a.lessons+d.lessons,exams:a.exams+d.exams,earned:a.earned+d.earned,spent:a.spent+d.spent}),{min:0,gameMin:0,lessons:0,exams:0,earned:0,spent:0});
  const max=Math.max(10,...days.map(d=>d.min));const Wc=700,Hc=200,bw=60,gap=(Wc-40-bw*7)/6;
  const chart=`<svg viewBox="0 0 ${Wc} ${Hc+40}" class="rchart" role="img" aria-label="Minutes learning each day this week">
    ${[0,.5,1].map(f=>`<line x1="30" x2="${Wc}" y1="${10+Hc*(1-f)}" y2="${10+Hc*(1-f)}" stroke="var(--line)" stroke-dasharray="4 6"/><text x="24" y="${14+Hc*(1-f)}" text-anchor="end" class="ax">${Math.round(max*f)}</text>`).join("")}
    ${days.map((d,i)=>{const x=40+i*(bw+gap);const hT=Hc*d.min/max,hG=Hc*Math.min(d.gameMin,d.min)/max;return `<rect x="${x}" y="${10+Hc-hT}" width="${bw}" height="${hT}" rx="8" fill="var(--sea)"/><rect x="${x}" y="${10+Hc-hG}" width="${bw}" height="${hG}" rx="8" fill="var(--coral)"/>${d.min?`<text x="${x+bw/2}" y="${4+Hc-hT}" text-anchor="middle" class="val">${d.min}</text>`:""}<text x="${x+bw/2}" y="${Hc+30}" text-anchor="middle" class="ax">${d.day}</text>`}).join("")}</svg>
    <div class="row" style="gap:16px;font-weight:800;font-size:14px"><span><i class="lg" style="background:var(--sea)"></i> Learning minutes</span><span><i class="lg" style="background:var(--coral)"></i> of which games</span></div>`;
  const ex=(k.exams||[]).slice(-12).reverse();
  const totalLessons=MAPS.reduce((s,m)=>s+m.lessons.length,0);
  const strong=LETTERS.filter(x=>mastery(x.ar)===3).length,weak=LETTERS.filter(x=>mastery(x.ar)===1).map(x=>x.ar);
  return `<div class="row" style="gap:8px">${DB.kids.map(x=>`<button class="chip ${x.id===pkid?"on":""}" data-pk="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:16px">
    <div class="row">${avatarBox(k,64)}<div style="flex:1;min-width:160px"><h2 style="font-size:28px">${esc(k.name)}'s report</h2><small style="font-weight:700;color:var(--ink-soft)">${(AGES[k.age]||AGES.explorers).emo} ${(AGES[k.age]||AGES.explorers).name} (${(AGES[k.age]||AGES.explorers).label}) · last active ${new Date(k.last||k.created).toLocaleDateString()}</small></div><button class="btn small" style="--c:var(--sea);--cd:var(--sea-deep)" data-copy>📋 Copy report</button></div>
    <div class="stat"><div><b>${wk.min}</b><small>Minutes this week</small></div><div><b>${wk.lessons}</b><small>Lessons this week</small></div><div><b>${wk.exams}</b><small>Exams & quizzes this week</small></div><div><b>${k.pearls}</b><small>Dinars in purse (+${wk.earned} / −${wk.spent} this week)</small></div></div>
    <div><div class="label" style="margin-bottom:6px">This week</div>${chart}</div>
    <div class="stat"><div><b>${Object.keys(k.done).length}<small style="font-size:16px">/${totalLessons}</small></b><small>Lessons completed</small></div><div><b>${MAPS.filter(m=>quizPassed(k,m.id)).length}<small style="font-size:16px">/${MAPS.length}</small></b><small>Journey stages passed</small></div><div><b>${Object.keys(k.hifz).length}<small style="font-size:16px">/${SURAHS.length}</small></b><small>Surahs memorised</small></div><div><b>${Object.keys(k.storiesDone||{}).length}<small style="font-size:16px">/${PROPHETS.length}</small></b><small>Prophet stories</small></div></div>
    <div><div class="label" style="margin-bottom:6px">Recent exams & quizzes</div>${ex.length?`<div class="tablewrap"><table class="rtable"><thead><tr><th>Date</th><th>Exam</th><th style="text-align:right">Score</th></tr></thead><tbody>${ex.map(e=>`<tr><td>${new Date(e.d).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</td><td>${esc(e.name||e.id)}</td><td class="num" style="color:${e.score/e.n>=.7?"var(--good)":e.score/e.n>=.5?"var(--sun-deep)":"var(--bad)"}">${e.score}/${e.n} · ${Math.round(e.score/e.n*100)}%</td></tr>`).join("")}</tbody></table></div>`:`<p class="sub">No exams yet.</p>`}</div>
    <div><div class="label" style="margin-bottom:6px">Letter mastery · ${strong} strong${weak.length?` · needs practice: <span class="ar" style="font-size:1.4em">${weak.join(" ")}</span>`:""}</div>
      <div class="lgrid">${LETTERS.map(x=>{const m=mastery(x.ar);return `<div class="m${m}"><span class="ar">${x.ar}</span><small>${["New","Practise","Getting there","Strong"][m]}</small></div>`}).join("")}</div></div>
    <div><div class="label" style="margin-bottom:6px">Purse history</div><div class="tablewrap"><table class="rtable"><tbody>${(k.tx||[]).slice(0,10).map(t=>`<tr><td>${new Date(t.d).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</td><td>${esc(t.why)}</td><td class="num" style="color:${t.n>0?"var(--good)":"var(--bad)"}">${t.n>0?"+":""}${t.n}</td></tr>`).join("")||`<tr><td>No activity yet.</td></tr>`}</tbody></table></div></div>
  </div>`;
}
function reportText(k){const d=lastDays(k);const w=d.reduce((a,x)=>a+x.min,0),l=d.reduce((a,x)=>a+x.lessons,0);const ex=(k.exams||[]).slice(-5).reverse();
  return `Iqra Island report: ${k.name}\nAge group: ${(AGES[k.age]||AGES.explorers).label}\nThis week: ${w} minutes, ${l} lessons\nLessons completed: ${Object.keys(k.done).length}\nJourney stages passed: ${MAPS.filter(m=>quizPassed(k,m.id)).map(m=>m.name).join(", ")||"none yet"}\nSurahs memorised: ${SURAHS.filter(s=>k.hifz[s.n]).map(s=>s.nameEn).join(", ")||"none yet"}\nProphet stories finished: ${PROPHETS.filter(p=>(k.storiesDone||{})[p.id]).map(p=>p.name).join(", ")||"none yet"}\nRecent exams: ${ex.map(e=>`${e.name} ${e.score}/${e.n}`).join("; ")||"none yet"}\nLetters needing practice: ${LETTERS.filter(x=>mastery(x.ar)===1).map(x=>x.name).join(", ")||"none"}\nGold dinars in purse: ${k.pearls}`}
function learnersHTML(){
  return `<div class="card"><h2 style="font-size:26px">Learners</h2>
    ${DB.kids.map(k=>`<div class="kidrow">${avatarBox(k,56)}<div class="nm"><b>${esc(k.name)}</b><small style="font-weight:800;color:var(--ink-soft)">${(AGES[k.age]||AGES.explorers).emo} ${(AGES[k.age]||AGES.explorers).label} · ${k.pearls} dinars · ${Object.keys(k.done).length} lessons</small></div>
      <div class="seg">${Object.values(AGES).map(g=>`<button data-kage="${k.id}|${g.id}" class="${(k.age||"explorers")===g.id?"on":""}" title="${g.label}">${g.emo} ${g.label.replace("Ages ","")}</button>`).join("")}</div>
      <div class="row" style="gap:6px"><button class="btn ghost small" data-give="${k.id}|10">+10 <span class="pearl" style="width:18px;height:18px"></span></button><button class="btn ghost small" data-give="${k.id}|-10">−10</button><button class="btn ghost small" data-ren="${k.id}">✏️ Rename</button><button class="btn ghost small" data-rst="${k.id}">↺ Reset</button><button class="btn ghost small" data-rm="${k.id}">🗑</button></div></div>`).join("")||`<p class="sub">No learners yet.</p>`}
    <h3 style="font-size:22px;margin-top:14px">Add a learner</h3>
    <div class="row"><input class="txt" id="newkid" maxlength="16" placeholder="Child's first name" autocomplete="off" style="flex:1;min-width:180px"><div class="seg" data-newage>${Object.values(AGES).map(g=>`<button data-na="${g.id}" class="${g.id==="explorers"?"on":""}">${g.emo} ${g.label}</button>`).join("")}</div><button class="btn small" data-addk>＋ Add learner</button></div>
  </div>`;
}
function controlsHTML(){const st=S();
  const seg=(key,opts,fmt)=>`<div class="seg">${opts.map(v=>`<button data-set="${key}|${v}" class="${st[key]===v?"on":""}">${fmt(v)}</button>`).join("")}</div>`;
  const sw=(key,t,s)=>`<div class="setting"><div class="t"><b>${t}</b><small>${s}</small></div><button class="switch ${st[key]?"on":""}" data-sw="${key}" role="switch" aria-checked="${!!st[key]}" aria-label="${esc(t)}"></button></div>`;
  return `<div class="card"><h2 style="font-size:26px;margin-bottom:6px">Controls</h2>
    ${sw("gamesOn","Games allowed","Arcade games, Super Muslim and Noor Guardians. Lessons, stories, exams and the Qur'an Garden always stay open.")}
    <div class="setting"><div class="t"><b>Daily game time</b><small>After this many minutes of games each day, games lock until tomorrow.</small></div>${seg("gameLimit",[0,15,30,45,60],v=>v?v+" min":"No limit")}</div>
    <div class="setting"><div class="t"><b>Arcade game price</b><small>Gold dinars each arcade game costs.</small></div>${seg("gameCost",[0,1,3,5],v=>v?v:"Free")}</div>
    <div class="setting"><div class="t"><b>Adventure games price</b><small>Gold dinars per play of Super Muslim or Noor Guardians.</small></div>${seg("smCost",[0,5,10,20],v=>v?v:"Free")}</div>
    <div class="setting"><div class="t"><b>Paid exams per day</b><small>How many exams a day can earn dinars. More attempts are practice only.</small></div>${seg("examCap",[1,3,5,10],v=>v)}</div>
    ${sw("unlockAll","Unlock every stage","Lets older or returning learners jump ahead on the journey and in Super Muslim.")}
    <div class="setting"><div class="t"><b>Parent passcode</b><small>${st.pin?"A passcode protects this area and adding learners.":"No passcode set."}</small></div><button class="btn ghost small" data-chpin>${st.pin?"Change passcode":"Set passcode"}</button></div>
  </div>`;
}
function settingsHTML(){const st=S();
  const sw=(key,t,s)=>`<div class="setting"><div class="t"><b>${t}</b><small>${s}</small></div><button class="switch ${st[key]?"on":""}" data-sw="${key}" role="switch" aria-checked="${!!st[key]}" aria-label="${esc(t)}"></button></div>`;
  return `<div class="card"><h2 style="font-size:26px;margin-bottom:6px">Settings</h2>
    ${sw("readAloud","Read instructions aloud","Jamal speaks each instruction in English. Great for pre-readers.")}
    ${sw("translit","Show transliteration","Shows English letters under Arabic (e.g. “bāb”). Turn off as reading improves.")}
    ${sw("sfx","Sound effects","Gentle chimes and pops. No music.")}
    <div class="setting"><div class="t"><b>Arabic speaking speed</b><small>Slower is easier for beginners.</small></div><div class="seg">${[[.6,"Slow"],[.8,"Normal"],[1,"Fast"]].map(([v,n])=>`<button data-rate="${v}" class="${st.rate===v?"on":""}">${n}</button>`).join("")}</div></div>
    <div class="setting"><div class="t"><b>Test voices</b><small data-vinfo>Letter sounds use your device's Arabic text-to-speech voice.</small></div><div class="row"><button class="say" data-tar>🔊 Arabic</button><button class="say" data-ten>🔊 English</button></div></div>
  </div>
  <div class="card"><h2 style="font-size:24px;margin-bottom:6px">About Iqra Island</h2>
    <p style="font-weight:600">“Iqra” (<span class="ar">اقْرَأْ</span>) means “Read!”, the first word revealed of the Qur'an. The journey runs Makkah → the Hijrah Trail → Madinah → Al-Quds (all 28 letters), then Jeddah Harbour (vowel marks) and AlUla Oasis (first words and Muslim phrases).</p>
    <p style="font-weight:600;margin-top:8px">Qur'an recitation: Mishary Rashid Alafasy (everyayah.com). Word-by-word timings: Qur'an.com. Progress is saved on this device only.</p></div>`;
}
function wireParents(){const st=S();
  $$("[data-pk]").forEach(b=>b.onclick=()=>{pkid=b.dataset.pk;go("parents")});
  const cp=$("[data-copy]");if(cp)cp.onclick=()=>{const t=reportText(kidById(pkid));try{navigator.clipboard.writeText(t).then(()=>toast("Report copied. Paste it into a message or email."),()=>showText(t))}catch(e){showText(t)}};
  $$("[data-sw]").forEach(b=>b.onclick=()=>{st[b.dataset.sw]=!st[b.dataset.sw];save();go("parents")});
  $$("[data-set]").forEach(b=>b.onclick=()=>{const[key,v]=b.dataset.set.split("|");st[key]=+v;save();go("parents")});
  $$("[data-rate]").forEach(b=>b.onclick=()=>{st.rate=+b.dataset.rate;save();go("parents")});
  const ta=$("[data-tar]");if(ta)ta.onclick=()=>{sayAr("بِسْمِ اللَّهِ. أَلِف، بَاء، تَاء");if(!hasArabic())$("[data-vinfo]").textContent="No Arabic voice detected. Install Google Text-to-Speech and add Arabic."};
  const te=$("[data-ten]");if(te)te.onclick=()=>speak("As-salaamu alaykum! I'm Jamal the camel.","en");
  const chp=$("[data-chpin]");if(chp)chp.onclick=()=>setPin(()=>go("parents"));
  $$("[data-kage]").forEach(b=>b.onclick=()=>{const[id,a]=b.dataset.kage.split("|");kidById(id).age=a;save();go("parents")});
  $$("[data-give]").forEach(b=>b.onclick=()=>{const[id,n]=b.dataset.give.split("|");const k=kidById(id);const prev=DB.cur;DB.cur=id;pearls(+n,+n>0?"Gift from parents":"Removed by parents");DB.cur=prev;save();go("parents")});
  $$("[data-ren]").forEach(b=>b.onclick=()=>{const k=kidById(b.dataset.ren);const m=modal(`<h3>Rename</h3><input class="txt" id="rn" maxlength="16" value="${esc(k.name)}" style="margin:0 auto"><div class="row center"><button class="btn small" data-ok>Save</button></div>`);$("[data-ok]",m.el).onclick=()=>{const v=$("#rn").value.trim();if(v){k.name=v;save()}m.close();go("parents")}});
  $$("[data-rst]").forEach(b=>b.onclick=async()=>{const k=kidById(b.dataset.rst);if(await ask("Reset progress?",`All of ${k.name}'s lessons, dinars, exams and treasures will be cleared.`,"Reset")){Object.assign(k,{...newKid(k.name,k.skin,k.age),id:k.id,created:k.created,wear:k.wear});save();toast("Progress reset.");go("parents")}});
  $$("[data-rm]").forEach(b=>b.onclick=async()=>{const k=kidById(b.dataset.rm);if(await ask("Remove learner?",`${k.name} and all their progress will be removed from this device.`,"Remove")){DB.kids=DB.kids.filter(x=>x.id!==k.id);if(DB.cur===k.id)DB.cur=null;save();go("parents")}});
  let na="explorers";$$("[data-na]").forEach(b=>b.onclick=()=>{na=b.dataset.na;$$("[data-na]").forEach(x=>x.classList.toggle("on",x===b))});
  const ak=$("[data-addk]");if(ak)ak.onclick=()=>{const n=$("#newkid").value.trim();if(!n){toast("Type the child's name first.");$("#newkid").focus();return}const k=newKid(n,1,na);DB.kids.push(k);if(!DB.cur)DB.cur=k.id;save();toast(`${n} added. They can choose their look on the welcome screen.`);go("parents")};
}
function showText(t){const m=modal(`<h3>Report</h3><textarea style="width:100%;height:220px;font:inherit;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:8px" readonly>${esc(t)}</textarea><button class="btn small" data-ok>Done</button>`);$("textarea",m.el).select();$("[data-ok]",m.el).onclick=()=>m.close()}

// ================= BOOT =================
setInterval(()=>{const k=kid();if(k&&document.visibilityState==="visible"&&window.__screen!=="profiles"){k.minutes=(k.minutes||0)+1;const L=dayLog(k);L.min++;if(window.__inGame)L.gameMin++;save()}},60000);
document.addEventListener("pointerdown",()=>ac(),{once:true});
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopSpeech();stopAyah()}});
go(kid()?"hub":"profiles");
// Android hardware back button (Capacitor App plugin): close pop-ups, then go back a level, then exit from the home screen.
(function(){try{const C=window.Capacitor;if(!C)return;const P=C.Plugins&&C.Plugins.App;
  const listen=(ev,cb)=>P&&P.addListener?P.addListener(ev,cb):C.addListener?C.addListener("App",ev,cb):null;
  const App={exitApp:()=>P&&P.exitApp?P.exitApp():C.nativePromise?C.nativePromise("App","exitApp",{}):null};
  if(!(P&&P.addListener)&&!C.addListener)return;
  listen("backButton",()=>{const m=$$(".modal-bg");if(m.length){m[m.length-1].remove();return}
    if(window.__screen==="hub"||window.__screen==="profiles"){App.exitApp();return}
    const vis=sel=>$$(sel).find(x=>x.offsetParent!==null&&!x.closest("[hidden]"));
    const paused=vis("#smPause,#ngPause");const pb=!paused&&vis("#smPauseBtn,#ngPauseBtn");if(pb){pb.click();return}
    const b=vis("#smExit,#ngExit,#obX,#stX,#bbX")||$("[data-back]")||$("[data-x]");if(b){b.click();return}go("hub")})}catch(e){}})();

</script></body></html>
