<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#14b8c4"><title>Iqra Island</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🐫</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lilita+One&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap"><style>/* Iqra Island — a bright, toy-like island world. One deliberate (light) look.
   Layout: full-screen app; a top bar, one scene at a time, chunky press-able buttons. */
:root{
  --sea:#14b8c4; --sea-deep:#0b7f9a; --sky:#bdeefa; --sky2:#e9fbff;
  --sand:#ffe4a3; --sand-deep:#f2c66d; --palm:#2f9e58; --palm-deep:#1f7a42;
  --coral:#ff6f59; --coral-deep:#d94c38; --sun:#ffc531; --sun-deep:#e09a00;
  --plum:#7b4fd6; --plum-deep:#5a33b0;
  --ink:#16324a; --ink-soft:#4b6378; --card:#fffdf6; --line:#e8d9b5;
  --good:#2fb36a; --bad:#ef5a4a;
  --f-display:"Baloo Bhaijaan 2","Baloo 2","Trebuchet MS","Segoe UI",sans-serif;
  --f-body:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;
  --f-ar:"Baloo Bhaijaan 2","Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro","Arabic Typesetting",serif;
  --f-quran:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--plum);outline-offset:3px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.quran{font-family:var(--f-quran);direction:rtl;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,var(--sand) 100%)}
.scene{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:64px}
.topbar .title{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar .title b{font-family:var(--f-display);font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title small{font-size:13px;color:var(--ink-soft);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:900;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line)}
.pearl{position:relative;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4 0 14%,#ffd54a 32%,#e8a917 70%,#b97c07 100%);box-shadow:inset 0 0 0 2px #c98d0a,inset -2px -3px 3px rgba(120,70,0,.35);display:inline-grid;place-items:center;flex:none}
.pearl::after{content:"د";font-family:var(--f-ar);font-weight:800;font-size:.55em;color:#8a5a00;line-height:1}
.pill .purse{font-size:20px;margin-right:-2px}
.iconbtn{width:52px;height:52px;border-radius:16px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- chunky buttons ---------- */
.btn{--c:var(--palm);--cd:var(--palm-deep);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 26px;border-radius:999px;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px;box-shadow:0 6px 0 var(--cd);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.btn.sun{--c:var(--sun);--cd:var(--sun-deep);color:var(--ink);text-shadow:none}
.btn.coral{--c:var(--coral);--cd:var(--coral-deep)}
.btn.sea{--c:var(--sea);--cd:var(--sea-deep)}
.btn.plum{--c:var(--plum);--cd:var(--plum-deep)}
.btn.ghost{--c:var(--card);--cd:var(--line);color:var(--ink);text-shadow:none;border:3px solid var(--line)}
.btn.small{min-height:44px;font-size:18px;padding:6px 18px}
.btn[disabled]{filter:grayscale(.8);opacity:.55;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.center{justify-content:center;text-align:center}

.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:0 6px 0 var(--line)}
.label{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- profiles ---------- */
.hero-logo{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding-top:8px}
.hero-logo h1{font-size:clamp(44px,9vw,76px);color:var(--ink);letter-spacing:-.01em}
.hero-logo h1 span{color:var(--coral)}
.hero-logo .ar{font-size:clamp(26px,5vw,38px);color:var(--sea-deep);font-weight:700}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;background:var(--card);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);font-family:var(--f-display);font-size:22px;font-weight:800}
.kid:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.kid small{font-family:var(--f-body);font-size:14px;color:var(--ink-soft);font-weight:700}
.kid.add{border-style:dashed;color:var(--ink-soft);justify-content:center;min-height:170px}

/* ---------- hub ---------- */
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:780px){.hub{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hub.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.hub{grid-template-columns:1fr}}
.place{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 18px 18px;border-radius:var(--r-lg);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);overflow:hidden;min-height:150px;isolation:isolate}
.place:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.place .em{font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.place b{font-family:var(--f-display);font-size:26px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.place small{font-weight:800;opacity:.95;font-size:15px}
.place .ar-tag{position:absolute;right:14px;top:10px;font-family:var(--f-ar);font-size:22px;opacity:.55;direction:rtl}
.place::after{content:"";position:absolute;right:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);z-index:-1}
.place.big{grid-column:1/-1;min-height:170px;flex-direction:row;align-items:center;gap:18px}
.place.big .em{font-size:80px}
.place.big b{font-size:34px}
.continue-chip{display:inline-flex;margin-top:6px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:4px 14px;font-weight:900;font-size:15px}

.speech{display:flex;align-items:flex-end;gap:10px}
.speech .bubble{position:relative;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--line);min-width:0}
.speech .bubble::before{content:"";position:absolute;left:-14px;bottom:16px;border:8px solid transparent;border-right:12px solid var(--line)}
.speech .bubble .ar{font-size:1.15em}
.jamal{flex:none;display:block}
.jamal.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- map ---------- */
.map-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.map-tabs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:3px solid var(--line);font-weight:900;font-size:15px;white-space:nowrap}
.map-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.map-tabs button.locked{opacity:.5}
.mapbox{position:relative;border-radius:var(--r-lg);overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.mapbox svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node .disc{transition:transform .15s}
.node:active .disc{transform:translateY(3px)}
.node.cur .disc{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.map-head h2{font-size:34px}
.map-head .ar{font-size:24px;color:var(--sea-deep)}

/* ---------- lesson shell ---------- */
.lessonbar{display:flex;align-items:center;gap:12px;padding:10px 16px}
.progress{flex:1;height:22px;background:rgba(255,255,255,.75);border:3px solid #fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--palm),#58c97c);border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.stage{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 28px;display:flex}
.stage .act{margin:auto;width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.prompt{font-family:var(--f-display);font-size:clamp(24px,4.4vw,34px);font-weight:800;line-height:1.15;text-wrap:balance}
.prompt .ar{color:var(--coral-deep)}
.sub{font-size:18px;font-weight:700;color:var(--ink-soft);max-width:60ch}
.say{display:inline-flex;align-items:center;gap:8px;background:var(--sea);color:#fff;border-radius:999px;padding:8px 18px 8px 12px;font-weight:900;box-shadow:0 5px 0 var(--sea-deep);font-size:18px}
.say:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sea-deep)}
.say.round{width:64px;height:64px;padding:0;justify-content:center;font-size:30px}

.bigletter{font-family:var(--f-ar);font-size:clamp(150px,30vw,240px);line-height:1.15;color:var(--coral);text-shadow:0 8px 0 rgba(217,76,56,.22);direction:rtl;cursor:pointer;animation:popin .6s cubic-bezier(.3,1.6,.6,1)}
.letter-card{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);flex-wrap:wrap}
.factlist{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:520px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);padding:10px 14px;font-weight:700}
.fact b{font-family:var(--f-display)}
.fact .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--sun);font-size:17px}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

.wordcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:var(--r-lg);padding:18px 28px;box-shadow:0 6px 0 var(--line)}
.wordcard .emo{font-size:96px;line-height:1.1}
.wordcard .ar{font-size:64px;line-height:1.3}
.wordcard .tr{font-size:22px;font-weight:900;color:var(--sea-deep)}
.wordcard .en{font-size:18px;font-weight:800;color:var(--ink-soft)}
.hl{color:var(--coral)}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px;width:100%;max-width:720px}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:130px;padding:10px;background:var(--card);border:4px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);transition:transform .1s}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice .ar{font-size:72px;line-height:1.2}
.choice .emo{font-size:64px;line-height:1.1}
.choice small{font-weight:900;color:var(--ink-soft);font-size:16px}
.choice.good{border-color:var(--good);background:#e6f8ee;box-shadow:0 6px 0 var(--good);animation:yay .5s}
.choice.bad{border-color:var(--bad);background:#fdecea;animation:shake .45s}
.choice.dim{opacity:.4}
@keyframes yay{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:560px}
.tile{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--card);border:4px solid var(--line);box-shadow:0 5px 0 var(--line);font-family:var(--f-ar);font-size:clamp(40px,9vw,62px);display:grid;place-items:center;line-height:1}
.tile.got{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 5px 0 #1e8a4f;animation:yay .4s}
.tile.bad{animation:shake .4s;border-color:var(--bad)}

/* balloons */
.sky{position:relative;width:100%;max-width:900px;height:min(62vh,520px);border-radius:var(--r-lg);background:linear-gradient(180deg,#9fe4f6,#e4f9ff);overflow:hidden;border:4px solid #fff;touch-action:none}
.balloon{position:absolute;width:92px;height:112px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:var(--f-ar);font-size:52px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);will-change:transform}
.balloon::after{content:"";position:absolute;bottom:-34px;left:50%;width:2px;height:34px;background:rgba(22,50,74,.35)}
.balloon::before{content:"";position:absolute;bottom:-6px;left:calc(50% - 6px);border:6px solid transparent;border-bottom:8px solid inherit}
.balloon.popped{animation:popb .3s forwards}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.hud{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:800;font-size:22px;z-index:3;pointer-events:none}
.hud span{background:rgba(255,255,255,.9);border-radius:999px;padding:2px 14px}

/* trace */
.tracewrap{position:relative;width:min(84vw,360px);aspect-ratio:1;max-width:100%;background:var(--card);border:4px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);touch-action:none}
.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:22px}
.meter{width:min(84vw,360px);height:16px;border-radius:999px;background:#fff;border:3px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--sun);transition:width .2s}

/* forms */
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:720px}
.form{display:flex;flex-direction:column;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);padding:10px 4px}
.form .ar{font-size:clamp(46px,9vw,74px);line-height:1.35;color:var(--coral)}
.form small{font-weight:900;font-size:14px;color:var(--ink-soft)}
.form.na{opacity:.4}

/* match */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:600px}
.mem{aspect-ratio:3/4;perspective:600px}
.mem .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mem.open .in{transform:rotateY(180deg)}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--line);box-shadow:0 5px 0 var(--line)}
.mem .f{background:repeating-linear-gradient(45deg,var(--sea) 0 12px,#2cc7d2 12px 24px);border-color:#fff}
.mem .f::after{content:"؟";font-family:var(--f-ar);font-size:44px;color:#fff;opacity:.85}
.mem .b{background:var(--card);transform:rotateY(180deg);padding:4px}
.mem .b .ar{font-size:clamp(34px,8vw,56px)}
.mem .b .tr{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5vw,30px);color:var(--sea-deep)}
.mem.done .b{border-color:var(--good);background:#e6f8ee}

/* build */
.slots{display:flex;flex-direction:row-reverse;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{width:84px;height:96px;border-radius:18px;border:4px dashed var(--sand-deep);background:rgba(255,255,255,.6);display:grid;place-items:center;font-family:var(--f-ar);font-size:52px}
.slot.fill{border-style:solid;border-color:var(--good);background:#e6f8ee}
.slot.next{border-color:var(--coral);animation:pulse 1.2s infinite}
.bank{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bank .tile{width:84px;height:84px;aspect-ratio:auto;font-size:48px}
.bank .tile.used{visibility:hidden}
.rtl-hint{font-weight:900;color:var(--coral-deep);font-size:15px}

/* syllables */
.syl{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.sylbtn{display:flex;flex-direction:column;align-items:center;min-width:110px;padding:8px 14px 10px;background:var(--card);border:4px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line)}
.sylbtn .ar{font-size:64px;line-height:1.4}
.sylbtn small{font-weight:900;color:var(--sea-deep);font-size:20px;font-family:var(--f-display)}
.sylbtn.heard{border-color:var(--good)}
.sylbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}

/* reward */
.shellstage{display:flex;flex-direction:column;align-items:center;gap:16px}
.shell{font-size:150px;line-height:1;cursor:pointer;animation:wobble 1.4s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.shell.crack{animation:crack .7s forwards}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes crack{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(0);opacity:0}}
.creature{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:520px;animation:popin .7s cubic-bezier(.3,1.6,.6,1)}
.creature .emo{font-size:130px;line-height:1.1}
.creature h2{font-size:34px}
.creature p{font-weight:700;font-size:18px}
.earn{font-family:var(--f-display);font-size:28px;font-weight:800;display:flex;align-items:center;gap:8px}

/* collection / souq */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);text-align:center}
.cc .emo{font-size:58px;line-height:1.1}
.cc b{font-family:var(--f-display);font-size:19px}
.cc small{font-weight:700;color:var(--ink-soft);font-size:14px}
.cc.lock{background:#eef3f6;border-style:dashed}
.cc.lock .emo{filter:grayscale(1) brightness(.2);opacity:.35}
.cc.on{border-color:var(--palm);box-shadow:0 5px 0 var(--palm)}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-family:var(--f-display);font-size:18px}
.price .pearl{width:18px;height:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--card);border:3px solid var(--line);font-weight:900}
.tabs button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.avatar-stage{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* library / books */
.book{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:820px;margin:0 auto}
.page{width:100%;background:var(--card);border:4px solid var(--line);border-radius:var(--r-lg);box-shadow:0 8px 0 var(--line);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:360px;justify-content:center}
.page .emo{font-size:110px;line-height:1.1}
.page .arline{font-family:var(--f-ar);direction:rtl;font-size:clamp(40px,7vw,60px);line-height:1.6;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.page .arline span{border-radius:12px;padding:0 6px;cursor:pointer}
.page .arline span.on{background:var(--sun)}
.page .tr{font-size:22px;font-weight:900;color:var(--sea-deep)}
.page .en{font-size:20px;font-weight:700}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--coral)}

/* quran */
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.surah{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);text-align:left}
.surah .num{flex:none;width:48px;height:48px;border-radius:14px;background:var(--palm);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;transform:rotate(45deg)}
.surah .num span{transform:rotate(-45deg)}
.surah .nm{flex:1;min-width:0}
.surah .nm b{font-family:var(--f-display);font-size:20px;display:block}
.surah .nm small{color:var(--ink-soft);font-weight:700}
.surah .ar{font-size:26px;color:var(--palm-deep)}
.ayah{background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ayah.playing{border-color:var(--palm);box-shadow:0 0 0 4px rgba(47,158,88,.2)}
.ayah .quran{font-size:clamp(30px,5vw,40px);line-height:2;text-align:right}
.anum{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:50%;border:2px solid var(--palm);color:var(--palm-deep);font-size:.55em;vertical-align:middle;margin-inline-start:6px;line-height:1}
.ayah .tr{font-weight:900;color:var(--sea-deep)}
.ayah .mn{font-weight:700;color:var(--ink-soft)}
.ayah .top{display:flex;align-items:center;gap:10px}
.ayah .top .n{font-family:var(--f-display);font-weight:800;color:var(--palm-deep)}

/* parents */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat div{background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.stat small{font-weight:800;color:var(--ink-soft)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lgrid div{display:flex;flex-direction:column;align-items:center;border-radius:14px;padding:6px;border:3px solid var(--line);background:#fff}
.lgrid .ar{font-size:34px;line-height:1.3}
.lgrid small{font-weight:900;font-size:12px}
.lgrid .m3{background:#e6f8ee;border-color:var(--good)}
.lgrid .m2{background:#fff6dc;border-color:var(--sun)}
.lgrid .m1{background:#fdecea;border-color:#f3b0a8}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:2px dashed var(--line)}
.setting:last-child{border-bottom:0}
.setting .t{min-width:0}
.setting .t b{display:block}
.setting .t small{color:var(--ink-soft);font-weight:700}
.switch{flex:none;width:64px;height:36px;border-radius:999px;background:#cfd8de;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--palm)}
.switch.on::after{left:32px}
.seg{display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-weight:900;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
input.txt{font:inherit;font-weight:800;font-size:22px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);width:100%;max-width:420px}
input.txt:focus{outline:4px solid var(--sea);outline-offset:1px}

/* certificate */
.cert{background:#fffaf0;border:10px double var(--sun-deep);border-radius:12px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:720px;margin:0 auto;position:relative}
.cert h2{font-size:clamp(28px,6vw,44px);color:var(--sun-deep)}
.cert .who{font-family:var(--f-display);font-size:clamp(30px,7vw,52px);font-weight:800;color:var(--plum)}
.cert .ar{font-size:28px;color:var(--palm-deep)}

/* overlays */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:12px 20px;border-radius:16px;z-index:50;max-width:min(92vw,520px);text-align:center;animation:popin .3s}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,64px);color:#fff;text-shadow:0 4px 0 var(--palm-deep),0 0 30px rgba(0,0,0,.15);text-align:center;animation:praise 1.1s forwards;white-space:nowrap}
.praise small{display:block;font-size:.45em;color:var(--ink);text-shadow:none;background:#fff;border-radius:999px;padding:2px 14px;margin-top:4px}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}75%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
.modal-bg{position:fixed;inset:0;background:rgba(22,50,74,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:var(--r-lg);padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;border:4px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.15);max-height:90vh;overflow:auto}
.modal h3{font-size:28px}

/* catcher */
.catch{position:relative;width:100%;max-width:900px;height:min(64vh,540px);border-radius:var(--r-lg);overflow:hidden;border:4px solid #fff;background:linear-gradient(180deg,#8fdcf2 0%,#d9f6ff 70%,var(--sand) 70%,var(--sand-deep) 100%);touch-action:none}
.catch .drop{position:absolute;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ar);font-size:42px;background:#fff;border:4px solid var(--line);box-shadow:inset -4px -6px 0 rgba(0,0,0,.06)}
.catch .basket{position:absolute;bottom:4%;width:120px;height:70px;font-size:64px;display:grid;place-items:center;transform:translateX(-50%)}
.target-badge{display:inline-flex;align-items:center;gap:8px;background:var(--coral);color:#fff;border-radius:999px;padding:4px 16px;font-family:var(--f-display);font-weight:800;font-size:22px}
.target-badge .ar{font-size:36px;line-height:1.2}

@media (max-width:520px){
  body{font-size:16px}
  .btn{font-size:19px;min-height:52px;padding:8px 20px}
  .tiles{gap:8px}
  .memgrid{gap:8px}
  .slot,.bank .tile{width:64px;height:74px;font-size:40px}
  .bank .tile{height:64px}
  .place.big{flex-direction:column;align-items:flex-start}
  .topbar{padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ================= v2: 3D journey ================= */
#app:has(.world-wrap) .scene{display:none}
.world-wrap{flex:1;min-height:0;position:relative;padding:0 12px}
.world{position:relative;width:100%;height:100%;overflow:hidden;perspective:1100px;perspective-origin:50% 15%;touch-action:none;cursor:grab;border-radius:26px;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.08);background:linear-gradient(180deg,#bfe9f7,#eaf9ff)}
.world.dragging{cursor:grabbing}
.plane{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.ground{position:absolute;left:0;top:0;display:block}
.bb{position:absolute;width:0;height:0;transform-origin:0 0;transform:translateZ(2px) rotateX(calc(var(--tilt) * -1));transform-style:preserve-3d;pointer-events:none}
.bbi{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.bb.deco .bbi{pointer-events:none;filter:drop-shadow(0 6px 2px rgba(0,0,0,.15))}
.disc3d{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:#e3e9ee;border:8px solid #fff;box-shadow:0 18px 0 rgba(0,0,0,.18);transform:translateZ(1px);cursor:pointer}
.disc3d.done{background:var(--ac)}
.disc3d.cur{background:#fff;border-color:var(--ac);animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 18px 0 rgba(0,0,0,.18),0 0 0 18px rgba(255,255,255,.55)}}
.token{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
.token .face{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#fff;border:6px solid #cfd8de;font-family:var(--f-display);font-weight:800;font-size:44px;color:#9aa9b4;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.token .face .ar{font-size:58px;line-height:1}
.token.done .face{background:var(--ac);border-color:#fff;color:#fff}
.token.cur .face{border-color:var(--ac);color:var(--ac);animation:bob 1.6s ease-in-out infinite}
.token.quiz .face{font-size:52px}
.token .lbl{background:rgba(255,255,255,.95);border-radius:999px;padding:2px 12px;font-weight:900;font-size:17px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.token .stars{font-size:20px;letter-spacing:-2px}
.token .lock{position:absolute;top:-6px;right:-10px;font-size:28px}
.token.arrive .face{animation:arrive .8s cubic-bezier(.3,1.6,.6,1)}
@keyframes arrive{0%{transform:scale(.6)}100%{transform:scale(1)}}
.landmark{display:flex;flex-direction:column;align-items:center;gap:2px;filter:drop-shadow(0 10px 4px rgba(0,0,0,.18));transition:transform .15s}
.landmark:active{transform:scale(.95)}
.lm-tag{display:flex;flex-direction:column;align-items:center;background:rgba(255,253,246,.96);border:3px solid var(--line);border-radius:14px;padding:2px 12px;line-height:1.15}
.lm-tag b{font-family:var(--f-display);font-size:18px;white-space:nowrap}
.lm-tag .ar{font-size:18px;color:var(--sea-deep)}
.shadow3d{position:absolute;width:90px;height:34px;margin:-17px 0 0 -45px;border-radius:50%;background:rgba(0,0,0,.25);transform:translateZ(1px);pointer-events:none}
.avatar .bbi{pointer-events:none}
.me{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 6px 3px rgba(0,0,0,.2))}
.me svg{background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.95) 0 55%,transparent 56%);border-radius:50%}
.me-tag{background:var(--coral);color:#fff;font-weight:900;border-radius:999px;padding:1px 12px;font-size:16px;margin-top:-6px;box-shadow:0 3px 0 var(--coral-deep)}
.avatar.walking .me{animation:hop .34s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.world-ui{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
.world-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(22,50,74,.72);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;z-index:5}
.world-lock{position:absolute;left:12px;right:70px;top:12px;z-index:5}
.stage-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;flex:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:3px solid var(--line);font-weight:900;font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.locked{opacity:.55}
.pin{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto}
.pin .pin-art{filter:drop-shadow(0 8px 4px rgba(0,0,0,.25));transition:transform .2s}
.pin.cur .pin-art{animation:bob 1.6s ease-in-out infinite}
.pin.lock .pin-art{filter:grayscale(.85) opacity(.7)}
.pin-tag{display:flex;flex-direction:column;align-items:center;background:#fff;border:4px solid var(--pc);border-radius:16px;padding:2px 12px;line-height:1.1;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.pin-tag b{font-family:var(--f-display);font-size:20px;white-space:nowrap}
.pin-tag small{font-weight:800;color:var(--ink-soft);font-size:13px;white-space:nowrap}
.pin.lock .pin-tag{border-color:#cfd8de}
.maplabels text{font-family:var(--f-display);font-weight:800;fill:#a8541f;opacity:.55;letter-spacing:.12em}
.maplabels .sea{fill:#fff;opacity:.85;font-style:italic;letter-spacing:.04em}
.maplabels .arl{font-family:var(--f-ar);letter-spacing:0}
.maplabels .small{fill:#7a5a3a;opacity:.45}

/* ================= v2: arcade ================= */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.game{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px 16px;border-radius:22px;background:var(--gc);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);min-height:150px;overflow:hidden;isolation:isolate}
.game:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.game .em{font-size:46px;line-height:1.1}
.game b{font-family:var(--f-display);font-size:22px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.game small{font-weight:800;font-size:14px;opacity:.95}
.game .best{margin-top:auto;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:1px 10px;font-weight:900;font-size:13px}
.game::after{content:"";position:absolute;right:-26px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15);z-index:-1}
.hud2{display:flex;gap:12px;font-family:var(--f-display);font-weight:800;font-size:22px}
.hud2 span{background:#fff;border-radius:999px;padding:2px 14px;border:3px solid var(--line)}
.holes{display:grid;gap:14px;width:100%;max-width:520px}
.hole{position:relative;aspect-ratio:1.1;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 70%,#8a5a3c 0 45%,#e2b26c 46% 100%);overflow:hidden}
.mole{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:bottom .18s ease-out;width:90%}
.hole.up .mole{bottom:8%}
.mole .mc{font-size:clamp(44px,10vw,64px);line-height:1}
.mole .ml{background:#fff;border:4px solid var(--line);border-radius:14px;font-size:clamp(30px,7vw,44px);padding:0 10px;line-height:1.3;margin-top:-10px}
.hole.bonk .mole{bottom:8%;filter:brightness(1.4)}
.sea:not(.btn){position:relative;width:100%;max-width:900px;height:min(60vh,520px);border-radius:var(--r-lg);overflow:hidden;border:4px solid #fff;background:linear-gradient(180deg,#9fe4f6 0 16%,#2cb5c9 16%,#0b7f9a 100%);touch-action:none}
.sea .boat{position:absolute;left:50%;top:2%;font-size:54px;transform:translateX(-50%)}
.fish{position:absolute;left:0;top:0;display:flex;align-items:center;gap:2px;will-change:transform}
.fish .fe{font-size:58px;line-height:1;display:inline-block}
.fish .fl{background:#fff;border-radius:12px;font-size:34px;padding:0 8px;line-height:1.3;border:3px solid var(--line)}
.fish.hooked{transition:transform .6s,opacity .6s;opacity:0;transform:translate(45vw,-60px) scale(.4)!important}
.tiles.echo .tile{background:var(--tc);color:#fff;border-color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);opacity:.8;transition:transform .1s,opacity .1s}
.tiles.echo .tile.lit{opacity:1;transform:scale(1.1);box-shadow:0 0 0 8px rgba(255,255,255,.8),0 6px 0 rgba(0,0,0,.2)}

/* ================= v2: Qur'an word highlight ================= */
.ayah .quran .w{transition:color .15s,text-shadow .15s;border-radius:8px}
.ayah .quran .w.read{color:#9b1c13}
.ayah .quran .w.now{color:#ff1f12;text-shadow:0 0 14px rgba(255,31,18,.45);background:rgba(255,31,18,.08)}
.ayah.bism .quran{font-size:clamp(28px,4.6vw,36px)}
.qctl{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.qctl .status{min-height:24px;font-weight:900;color:var(--palm-deep)}
.ayah .rep{margin-left:auto;font-weight:900;color:var(--coral-deep);font-family:var(--f-display)}
.ayah.yourturn{border-color:var(--sun);box-shadow:0 0 0 5px rgba(255,197,49,.35)}
.seg{flex-wrap:wrap}

/* ================= v2: age bands ================= */
.age-seeds .prompt{font-size:clamp(28px,5vw,40px)}
.age-seeds .choice{min-height:160px}
.age-seeds .choice .ar{font-size:92px}
.age-seeds .btn{min-height:64px;font-size:24px}
.age-seeds .tile{font-size:clamp(48px,11vw,72px)}
.age-scholars .sub,.age-adventurers .sub{font-size:16px}

/* ================= v3 ================= */
.me .mbody{transition:transform .2s}
.avatar.left .me .mbody{transform:scaleX(-1)}
.me .legs{display:flex;gap:10px;margin-top:-10px;height:22px}
.me .legs i{display:block;width:9px;height:22px;border-radius:5px;background:#3b3f58;transform-origin:50% 0;box-shadow:0 6px 0 -2px #7a4a2a}
.avatar.walking .me .legs i:first-child{animation:legA .34s ease-in-out infinite}
.avatar.walking .me .legs i:last-child{animation:legA .34s ease-in-out infinite reverse}
@keyframes legA{0%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}100%{transform:rotate(28deg)}}
.avatar.walking .me{animation:hop .34s ease-in-out infinite}
.bb.foot .bbi{font-size:22px;opacity:.7;animation:fadefoot 2.6s forwards;pointer-events:none}
@keyframes fadefoot{to{opacity:0}}
.iconbtn.sm{width:40px;height:40px;font-size:18px;border-radius:12px}
.ayah .top{flex-wrap:wrap}
.pill{cursor:pointer}
.storygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.storycard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 12px 16px;border-radius:22px;background:var(--card);border:4px solid var(--sc);box-shadow:0 6px 0 var(--sc);text-align:center}
.storycard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sc)}
.storycard .em{font-size:54px;line-height:1.1}
.storycard .ar{font-size:30px;color:var(--sc);line-height:1.3}
.storycard b{font-family:var(--f-display);font-size:20px}
.storycard small{font-weight:800;color:var(--ink-soft);font-size:12px}
.storycard .best{margin-top:6px;background:var(--sc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:900;font-size:13px}
.keyword{display:flex;flex-direction:column;align-items:center;background:#fff6dc;border:3px solid var(--sun);border-radius:18px;padding:8px 20px}
.keyword .ar{font-size:40px;color:var(--coral-deep);line-height:1.4}
.keyword b{font-family:var(--f-display);font-size:20px;color:var(--sea-deep)}
.keyword small{font-weight:800;color:var(--ink-soft)}
/* Super Muslim */
.smcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.smtitle{font-size:clamp(40px,8vw,62px);color:#1f9a57;-webkit-text-stroke:2px #fff;text-shadow:0 5px 0 #1f7a42}
.smtitle span{color:var(--sun-deep)}
.smlevels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:560px){.smlevels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.smlv{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px;border-radius:18px;background:#fff;border:3px solid #1f9a57;box-shadow:0 5px 0 #1f7a42;font-weight:900}
.smlv b{font-family:var(--f-display);font-size:28px;color:#1f9a57;line-height:1}
.smlv .ar{font-size:20px;color:var(--sea-deep)}
.smlv small{font-weight:800;color:var(--ink-soft)}
.smlv.locked{filter:grayscale(1);opacity:.55}

.tline{display:flex;flex-direction:column;align-items:center;padding:10px;border-radius:16px;background:#fffdf6;border:3px solid var(--line)}
.tline .ar{font-size:clamp(24px,5vw,34px);line-height:1.8;color:var(--sea-deep)}.tline b{font-size:18px}.tline small{font-weight:700;color:var(--ink-soft)}
.tline.on{border-color:var(--good);background:#e6f8ee}
.hjact{gap:8px}
.hjcvbox{position:relative;display:grid;place-items:center}
.hjcv{border-radius:18px;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.12);touch-action:none}
.hjsay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;padding:10px 20px;border-radius:20px;background:#ffc531;border:4px solid #fff;box-shadow:0 6px 0 var(--sun-deep),0 10px 30px rgba(0,0,0,.25);z-index:2}
.hjsay .ar{font-size:30px;line-height:1.5}.hjsay small{font-weight:900}
.hjsay.dua{top:auto;bottom:10px;transform:translateX(-50%);background:#bdeefa;box-shadow:0 6px 0 var(--sea-deep)}.hjsay.dua .ar{font-size:20px}
.hjsay.pop{animation:hjpop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes hjpop{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.hjwalk{min-width:240px;font-size:22px;touch-action:none}.hjwalk.on{transform:translateY(5px);box-shadow:0 1px 0 var(--cd,rgba(0,0,0,.2))}
/* ===== v7: Find It, Minaret Stack, Picture Puzzle, book shelves ===== */
.fdlist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fdt{font-size:30px;line-height:1;background:#fff;border:3px solid var(--line);border-radius:14px;padding:4px 8px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transition:.2s}
.fdt.done{background:#e6f8ee;border-color:var(--good);opacity:.55;transform:scale(.9)}
.fdsvg{max-height:calc(100vh - 210px)}
.sm2.stk{background:#7fd0ff}
.pzbox{position:relative;width:min(100%,calc((100vh - 230px)*4/3));margin:0 auto}
.pz{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;background:#16324a;padding:3px;border-radius:16px;aspect-ratio:4/3}
.pzt{position:relative;padding:0;border:0;border-radius:6px;overflow:hidden;background:#fff;display:block;width:100%;height:100%}
.pzt svg{display:block;width:100%;height:100%}
.pzt.empty{background:rgba(255,255,255,.08)}
.pzt.mv{animation:pzslide .14s ease-out}
@keyframes pzslide{from{transform:translate(var(--dx),var(--dy))}to{transform:none}}
.pzn{position:absolute;left:4px;top:3px;background:rgba(22,50,74,.75);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:0 7px}
.pz.solved{gap:0;padding:0;transition:gap .4s}.pz.solved .pzt{border-radius:0}.pz.solved .pzn{display:none}
.pzfull{position:absolute;inset:0;border-radius:16px;overflow:hidden;box-shadow:0 0 0 4px #ffc531}.pzfull svg{width:100%;height:100%;display:block}
.bookcover{position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18),inset 10px 0 0 rgba(0,0,0,.12)}

ong the jinn and people.”", "words": ["مِنَ", "ٱلْجِنَّةِ", "وَٱلنَّاسِ"], "t": [[0.1, 0.37], [0.38, 2.52], [2.53, 6.96]]}]}, {"n": 113, "nameEn": "Al-Falaq", "nameAr": "الفلق", "meaningEn": "The Daybreak", "intro": "Al-Falaq means “The Daybreak”. We ask Allah, Lord of the morning light, to keep us safe from every harm.", "bismillahPre": true, "ayat": [{"a": 1, "text": "قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ", "translit": "Qul a'uzoo bi rabbil-falaq", "meaning": "Say: “I seek protection with the Lord of the daybreak,", "words": ["قُلْ", "أَعُوذُ", "بِرَبِّ", "ٱلْفَلَقِ"], "t": [[0.07, 0.4], [0.41, 1.32], [1.33, 2.26], [2.28, 3.11]]}, {"a": 2, "text": "مِن شَرِّ مَا خَلَقَ", "translit": "Min sharri ma khalaq", "meaning": "from the harm of everything He created,", "words": ["مِن", "شَرِّ", "مَا", "خَلَقَ"], "t": [[0.06, 1.44], [1.45, 2.23], [2.24, 2.61], [2.62, 3.36]]}, {"a": 3, "text": "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ", "translit": "Wa min sharri ghasiqin iza waqab", "meaning": "and from the harm of the night when its darkness settles,", "words": ["وَمِن", "شَرِّ", "غَاسِقٍ", "إِذَا", "وَقَبَ"], "t": [[0.07, 1.47], [1.48, 2.17], [2.18, 3.27], [3.28, 3.91], [3.92, 4.57]]}, {"a": 4, "text": "وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ", "translit": "Wa min sharrin-naffaa-thaati fil 'uqad", "meaning": "and from the harm of those who blow on knots (doing magic),", "words": ["وَمِن", "شَرِّ", "ٱلنَّفَّـٰثَـٰتِ", "فِى", "ٱلْعُقَدِ"], "t": [[0.07, 1.48], [1.49, 2.24], [2.25, 4.53], [4.54, 4.76], [4.77, 5.66]]}, {"a": 5, "text": "وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", "translit": "Wa min sharri haasidin iza hasad", "meaning": "and from the harm of a jealous person when they feel jealous.”", "words": ["وَمِن", "شَرِّ", "حَاسِدٍ", "إِذَا", "حَسَدَ"], "t": [[0.07, 1.34], [1.35, 2.0], [2.01, 3.18], [3.19, 3.76], [3.77, 4.47]]}]}, {"n": 112, "nameEn": "Al-Ikhlas", "nameAr": "الإخلاص", "meaningEn": "The Sincerity", "intro": "Al-Ikhlas means “Sincerity”. In four short ayat it tells us who Alla const L = Object.fromEntries(LETTERS.map((x,i)=>[x.ar,Object.assign(x,{i})]));

// letters that look alike: used for tricky distractors
const LOOKALIKE = [["ب","ت","ث","ن","ي"],["ج","ح","خ"],["د","ذ"],["ر","ز","و"],["س","ش"],["ص","ض"],["ط","ظ"],["ع","غ"],["ف","ق"],["ك","ل"],["ه","م"]];
function lookalikes(a){const g=LOOKALIKE.find(g=>g.includes(a));return g?g.filter(x=>x!==a):[]}

  kasra:{mark:"ِ",name:"Kasra",ar:"كَسْرَة",snd:"i",desc:"A small line BELOW the letter. It makes a short “i” sound, like in “sit”.",mouth:"Smile wide: “i”!"},
  damma:{mark:"ُ",name:"Ḍamma",ar:"ضَمَّة",snd:"u",desc:"A tiny curly “و” ABOVE the letter. It makes a short “u” sound, like in “put”.",mouth:"Make a round mouth: “u”!"},
  sukun:{mark:"ْ",name:"Sukūn",ar:"سُكُون",snd:"",desc:"A little circle ABOVE the letter. It means: stop! No vowel, just the letter's own sound.",mouth:"Stop the sound!"},
};
// letter + mark -> transliteration
function syl(letter,v){
  const b=L[letter].snd;
  if(letter==="ا") return v==="a"?"a":v==="i"?"i":"u";
  return b+v;
}

function tone(freq,dur=.15,type="sine",vol=.18,delay=0,slide=0){const c=ac();if(!c||!S().sfx)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}

// ---------- speech (native TTS in the app, Web Speech in browsers) ----------
const isNative=()=>{try{return !!(window.Capacitor&&(Capacitor.isNativePlatform?Capacitor.isNativePlatform():Capacitor.getPlatform&&Capacitor.getPlatform()!=="web"))}catch(e){return false}};
let VOICES=[];let nativeLangs=null;
function loadVoices(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
if(isNative()){try{Capacitor.nativePromise("TextToSpeech","getSupportedLanguages",{}).then(r=>{nativeLangs=(r.languages||[]).map(x=>x.toLowerCase().replace("_","-"))}).catch(()=>{nativeLangs=[]})}catch(e){}}
function hasArabic(){if(isNative())return nativeLangs==null?true:nativeLangs.some(l=>l.startsWith("ar"));return VOICES.some(v=>/^ar/i.test(v.lang))}
let speakToken=0;
function stopSpeech(){speakToken++;try{if(isNative())Capacitor.nativePromise("TextToSpeech","stop",{}).catch(()=>{});else speechSynthesis.cancel()}catch(e){}}
function speak(text,lang="en",opts={}){
  const my=++speakToken;
  const rate=(opts.rate??(lang==="ar"?S().rate:0.95));
  if(isNative()){
    const lg=lang==="ar"?"ar-SA":"en-AU";
    try{return Capacitor.nativePromise("TextToSpeech","speak",{text,lang:lg,rate,pitch:lang==="en"?1.1:1,volume:1,category:"playback",queueStrategy:0}).catch(()=>{})}catch(e){return Promise.resolve()}
  }
  return new Promise(res=>{
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const pref=lang==="ar"?/^ar/i:/^en[-_](AU|GB)/i;
      const v=VOICES.find(v=>pref.test(v.lang)&&/google|natural|neural/i.test(v.name))||VOICES.find(v=>pref.test(v.lang))||(lang==="en"?VOICES.find(v=>/^en/i.test(v.lang)):null);
      if(v)u.voice=v;u.lang=lang==="ar"?(v?.lang||"ar-SA"):(v?.lang||"en-AU");u.rate=rate;u.pitch=lang==="en"?1.1:1;
      u.onend=u.onerror=()=>res();
      if(lang==="ar"&&!v&&!isNative())warnNoArabic();
      speechSynthesis.speak(u);setTimeout(res,8000);
    }catch(e){res()}
  });
}
async function sayAr(t){return speak(t,"ar")}
async function sayEn(t){if(S().readAloud)return speak(t,"en")}
let warnedAr=false;
function warnNoArabic(){if(warnedAr)return;warnedAr=true;toast("No Arabic voice found on this device. Ask a grown-up to add an Arabic voice in Text-to-Speech settings. You can still read the sounds on screen!",4500)}

function confetti(n=120){const c=$("#fx");if(!c)return;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#ff6f59","#ffc531","#2f9e58","#14b8c4","#7b4fd6","#fff"];const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*16-6,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,s:Math.random()>.5}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.s)x.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{x.beginPath();x.arc(0,0,p.r/1.4,0,7);x.fill()}x.restore()});if(++t<140)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

// ================= LESSON BUILDERS =================
const optAr=(t,small)=>`<span class="ar">${t}</span>${small?`<small>${esc(small)}</small>`:""}`;
const optPic=w=>`<span class="emo">${w.emo}</span><small>${esc(w.en)}</small>`;
const optText=t=>`<b style="font-size:20px;line-height:1.2">${esc(t)}</b>`;
const plain=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[ʿʾ]/g,"'");
const knownUpTo=a=>LETTERS.slice(0,L[a].i+1).map(x=>x.ar);

function distractors(target,pool,n,avoid=x=>false){
  const cand=shuffle([...new Set([...lookalikes(target),...shuffle(pool)])]).filter(a=>a!==target&&!avoid(a));
  const out=cand.slice(0,n);let i=0;while(out.length<n&&i<LETTERS.length){const a=LETTERS[i++].ar;if(a!==target&&!out.includes(a)&&!avoid(a))out.push(a)}return out;
}
const sameSound=(a,b)=>plain(L[a].snd)===plain(L[b].snd);

const NOPT=()=>Math.max(1,AGE().opts-1);
function qListenLetter(a,pool){const x=L[a];const ops=shuffle([a,...distractors(a,pool,NOPT(),b=>sameSound(a,b))]);
  return{prompt:`Which letter says “${esc(x.snd)}”?`,speakEn:`Which letter says this sound?`,speakAr:x.say,letter:a,answer:a,options:ops.map(o=>({key:o,html:optAr(o)}))}}
function qNameLetter(a,pool){const x=L[a];const ops=shuffle([a,...distractors(a,pool,NOPT())]);
  return{prompt:`Which one is <b>${esc(x.name)}</b>?`,speakEn:`Which one is ${x.name}?`,speakAr:x.nameAr,letter:a,answer:a,options:ops.map(o=>({key:o,html:optAr(o)}))}}
function qPicture(a){const x=L[a];const others=shuffle(LETTERS.filter(y=>y.ar!==a&&baseOf(clusters(y.word.ar)[0])!==baseOf(a))).slice(0,NOPT());const ops=shuffle([x,...others]);
  return{prompt:`Which picture starts with <span class="ar">${x.ar}</span>?`,speakEn:`Which picture starts with ${x.name}?`,letter:a,answer:x.ar,options:ops.map(o=>({key:o.ar,html:optPic(o.word)})),onRight:()=>sayAr(x.word.ar)}}

function letterLesson(a){
  const x=L[a];const pool=knownUpTo(a);const prev=pool.slice(0,-1);
  const steps=[["meet",{letter:a}],["word",{letter:a}],["trace",{letter:a}],["find",{letter:a,pool}]];
  const cand=[qListenLetter(a,pool),qPicture(a)];
  if(prev.length)cand.push(qNameLetter(pick(prev.slice(-4)),pool));
  cand.push(qNameLetter(a,pool));
  if(prev.length)cand.push(qListenLetter(pick(prev.slice(-5)),pool));
  cand.push(qListenLetter(a,pool));
  steps.push(["choose",{rounds:cand.slice(0,AGE().rounds)}]);
  steps.push(["balloons",{target:a,targetLabel:`Only pop <b>${esc(x.name)}</b>, the “${esc(x.snd)}” sound!`,others:distractors(a,pool,4)}]);
  if(AGE().forms)steps.push(["forms",{letter:a}]);
  if(pool.length>=3){const ps=[a,...shuffle(prev).slice(0,AGE().pairs-1)];steps.push(["memory",{pairs:ps.map(l=>[l,L[l].snd,L[l].say])}])}
  else steps.push(["choose",{rounds:[qListenLetter(a,LETTERS.slice(0,5).map(x=>x.ar))]}]);
  return steps;
}

const HL=["ب","ت","ج","د","ر","س","م","ن","ل","ك","ف","ق"];
function sylItems(h,letters){const m=HARAKAT[h];return letters.map(a=>({ar:a+m.mark,tr:syl(a,m.snd),say:a+m.mark,letter:a}))}
function qSyl(target,options,extra=""){options=[target,...shuffle(options.filter(o=>o.ar!==target.ar)).slice(0,NOPT())];return{prompt:`Which one says “${esc(target.tr)}”?${extra}`,speakEn:`Which one says this?`,speakAr:target.say,answer:target.ar,letter:target.letter,options:shuffle(options).map(o=>({key:o.ar,html:optAr(o.ar)}))}}

function harakaLesson(h){
  const m=HARAKAT[h];const ls=shuffle(HL).slice(0,6);const items=sylItems(h,ls);
  const steps=[["info",{speech:`This is <b>${m.name}</b> <span class="ar">${m.ar}</span>`,big:"ب"+m.mark,title:`${esc(m.name)} says “${m.snd}”`,facts:[["✏️",esc(m.desc)],["👄",esc(m.mouth)]],sayAr:"ب"+m.mark,sayLabel:`Hear “b${m.snd}”`,intro:`This is ${m.name}. ${m.desc}`}]];
  steps.push(["showcase",{title:`Read with ${esc(m.name)}`,sub:`Every letter now says its sound + “${m.snd}”.`,items}]);
  steps.push(["choose",{rounds:shuffle(items).slice(0,4).map(t=>qSyl(t,items))}]);
  const tg=items[0];steps.push(["balloons",{target:tg.ar,targetLabel:`Pop only “${esc(tg.tr)}”!`,others:items.slice(1).map(i=>i.ar)}]);
  steps.push(["memory",{pairs:items.slice(0,Math.min(items.length,AGE().pairs)).map(i=>[i.ar,i.tr,i.say])}]);
  return steps;
}
function mixLesson(){
  const ls=shuffle(HL).slice(0,3);const all=ls.flatMap(a=>["fatha","kasra","damma"].map(h=>({ar:a+HARAKAT[h].mark,tr:syl(a,HARAKAT[h].snd),say:a+HARAKAT[h].mark,letter:a})));
  const steps=[["info",{speech:"Now let's mix them up!",title:"One letter, three sounds",facts:[["⬆️",`Line on top: <span class="ar" style="font-size:1.5em">بَ</span> = “ba”`],["⬇️",`Line below: <span class="ar" style="font-size:1.5em">بِ</span> = “bi”`],["🌀",`Curl on top: <span class="ar" style="font-size:1.5em">بُ</span> = “bu”`]],intro:"One letter can make three sounds. A line on top says a. A line below says i. A curl on top says u."}]];
  steps.push(["showcase",{title:"Tap and listen",items:all.slice(0,6)}]);
  const rounds=shuffle(all).slice(0,5).map(t=>qSyl(t,all.filter(o=>o.letter===t.letter)));
  steps.push(["choose",{rounds}]);
  steps.push(["memory",{pairs:shuffle(all).slice(0,AGE().pairs).map(i=>[i.ar,i.tr,i.say])}]);
  const tg=pick(all);steps.push(["balloons",{target:tg.ar,targetLabel:`Pop only “${esc(tg.tr)}”!`,others:all.filter(o=>o!==tg).map(o=>o.ar)}]);
  return steps;
}
const SUKUN=[{ar:"مِنْ",tr:"min",en:"from"},{ar:"لَمْ",tr:"lam",en:"did not"},{ar:"قُلْ",tr:"qul",en:"say!"},{ar:"هَلْ",tr:"hal",en:"is it…?"},{ar:"عَنْ",tr:"ʿan",en:"about"},{ar:"بَلْ",tr:"bal",en:"but rather"}];
const LONGV=[{ar:"بَا",tr:"bā",short:"بَ"},{ar:"بِي",tr:"bī",short:"بِ"},{ar:"بُو",tr:"bū",short:"بُ"},{ar:"نَا",tr:"nā",short:"نَ"},{ar:"فِي",tr:"fī",short:"فِ"},{ar:"نُو",tr:"nū",short:"نُ"}];
const SHADDA=[{ar:"رَبّ",tr:"rabb",en:"Lord"},{ar:"أُمّ",tr:"umm",en:"mum"},{ar:"جَدّ",tr:"jadd",en:"grandpa"},{ar:"قِطّ",tr:"qiṭṭ",en:"cat"},{ar:"حَجّ",tr:"ḥajj",en:"Hajj"},{ar:"بَطَّة",tr:"baṭṭa",en:"duck"}];
function listLesson(kind){
  const cfg={
    sukun:{list:SUKUN,big:"بْ",speech:`This is <b>Sukūn</b> <span class="ar">سُكُون</span>`,title:"Sukūn means STOP",facts:[["⭕",esc(HARAKAT.sukun.desc)],["🛑",`<span class="ar" style="font-size:1.5em">مِنْ</span> = “m-i-n”: the <b>n</b> just stops.`]],intro:"This is sukoon. A little circle on top means stop. No vowel."},
    long:{list:LONGV,big:"بَا",speech:"Some sounds are <b>long</b>!",title:"Long vowels: aa, ii, uu",facts:[["🅰️",`Fatḥa + Alif <span class="ar" style="font-size:1.5em">بَا</span> = “baa” (long a)`],["🇮",`Kasra + Yaa <span class="ar" style="font-size:1.5em">بِي</span> = “bii” (long ee)`],["🇺",`Ḍamma + Waaw <span class="ar" style="font-size:1.5em">بُو</span> = “buu” (long oo)`]],intro:"Some sounds are long! Alif, Yaa and Waaw stretch the sound. Hold it for two beats."},
    shadda:{list:SHADDA,big:"بّ",speech:`This is <b>Shadda</b> <span class="ar">شَدَّة</span>`,title:"Shadda: say it twice!",facts:[["〰️","A little “w” shape on top. It means the letter is doubled: say it strongly, twice."],["🦆",`<span class="ar" style="font-size:1.5em">بَطَّة</span> = “baṭ-ṭa” (duck)`]],intro:"This is shadda. It looks like a small w. It means say the letter twice."},
  }[kind];
  const items=cfg.list.map(w=>({...w,say:w.ar}));
  const steps=[["info",{speech:cfg.speech,big:cfg.big,title:cfg.title,facts:cfg.facts,sayAr:cfg.big,intro:cfg.intro}]];
  steps.push(["showcase",{title:"Tap and listen",items:items.map(i=>({...i,en:i.en}))}]);
  let rounds;
  if(kind==="long")rounds=shuffle(items).slice(0,5).map(t=>({prompt:`Which one is the LONG “${esc(t.tr)}”?`,speakEn:"Which one is long?",speakAr:t.ar,answer:t.ar,options:shuffle([t.ar,t.short]).map(o=>({key:o,html:optAr(o)}))}));
  else rounds=shuffle(items).slice(0,5).map(t=>qSyl(t,items));
  steps.push(["choose",{rounds}]);
  steps.push(["memory",{pairs:shuffle(items).slice(0,AGE().pairs).map(i=>[i.ar,i.tr,i.say])}]);
  return steps;
}
function qHearPic(w,set){const ops=shuffle([w,...shuffle(set.filter(x=>x!==w)).slice(0,NOPT())]);return{prompt:"Listen! Which picture is it?",speakEn:"Listen. Which picture is it?",speakAr:w.ar,answer:w.ar,options:ops.map(o=>({key:o.ar,html:optPic(o)}))}}
function qReadPic(w,set){const ops=shuffle([w,...shuffle(set.filter(x=>x!==w)).slice(0,NOPT())]);return{prompt:"Read it yourself! Which picture matches?",speakEn:"Read the word. Which picture matches?",show:`<div class="wordcard" style="padding:8px 30px"><div class="ar">${w.ar}</div></div>`,answer:w.ar,options:ops.map(o=>({key:o.ar,html:optPic(o)})),onRight:()=>sayAr(w.ar)}}
function wordsLesson(set){
  const ws=WORDS[set];
  const steps=[["showcase",{title:"New words!",sub:"Tap each picture to hear the Arabic word.",items:ws.map(w=>({...w,say:w.ar}))}]];
  steps.push(["choose",{rounds:shuffle(ws).slice(0,3).map(w=>qHearPic(w,ws))}]);
  [...ws].sort((a,b)=>clusters(a.ar).length-clusters(b.ar).length).slice(0,2).forEach(w=>steps.push(["build",{word:w}]));
  steps.push(["choose",{rounds:shuffle(ws).slice(0,3).map(w=>qReadPic(w,ws))}]);
  steps.push(["memory",{pairs:shuffle(ws).slice(0,Math.min(5,AGE().pairs)).map(w=>[w.ar,`<span style="font-size:44px">${w.emo}</span>`,w.ar])}]);
  return steps;
}
function phrasesLesson(){
  const ps=WORDS.phrases;
  const steps=[["showcase",{title:"Words Muslims say every day",sub:"Tap each card to hear it.",big:true,items:ps.map(p=>({...p,alwaysTr:true,say:p.ar}))}]];
  steps.push(["choose",{rounds:shuffle(ps).slice(0,4).map(p=>({prompt:`What do we say ${esc(p.when)}?`,speakEn:`What do we say ${p.when}?`,answer:p.ar,onRight:()=>sayAr(p.ar),options:shuffle([p,...shuffle(ps.filter(x=>x!==p)).slice(0,NOPT())]).map(o=>({key:o.ar,html:`<span class="ar" style="font-size:34px">${o.ar}</span><small>${esc(o.tr)}</small>`}))}))}]);
  steps.push(["choose",{rounds:shuffle(ps).slice(0,3).map(p=>({prompt:"What does this mean?",speakAr:p.ar,show:`<div class="wordcard" style="padding:8px 24px"><div class="ar" style="font-size:44px">${p.ar}</div>${trBit(p.tr)}</div>`,answer:p.en,options:shuffle([p,...shuffle(ps.filter(x=>x!==p)).slice(0,NOPT())]).map(o=>({key:o.en,html:optText(o.en)}))}))}]);
  return steps;
}
function buildLesson(map,i){
  const ls=map.lessons[i];
  if(ls.type==="letter")return letterLesson(ls.letter);
  if(ls.type==="haraka")return harakaLesson(ls.h);
  if(ls.type==="mix")return mixLesson();
  if(["sukun","long","shadda"].includes(ls.type))return listLesson(ls.type);
  if(ls.type==="words")return wordsLesson(ls.set);
  if(ls.type==="phrases")return phrasesLesson();
  return [];
}
function lessonTitle(ls){if(ls.type==="letter"){const x=L[ls.letter];return `${x.name} ${x.ar}`}return ls.title}

function buildQuiz(map){
  let bank=[];
  map.lessons.forEach(ls=>{
    if(ls.type==="letter"){const pool=map.lessons.map(l=>l.letter);bank.push(qListenLetter(ls.letter,pool),qNameLetter(ls.letter,pool),qPicture(ls.letter))}
    if(ls.type==="haraka"){for(let j=0;j<2;j++){const it=sylItems(ls.h,shuffle(HL).slice(0,3));bank.push(qSyl(it[0],it))}}
    if(ls.type==="mix"){const a=pick(HL);const all=["fatha","kasra","damma"].map(h=>({ar:a+HARAKAT[h].mark,tr:syl(a,HARAKAT[h].snd),say:a+HARAKAT[h].mark}));bank.push(qSyl(pick(all),all),qSyl(pick(all),all))}
    if(ls.type==="sukun"){const t=pick(SUKUN);bank.push(qSyl({...t,say:t.ar},SUKUN))}
    if(ls.type==="long"){const t=pick(LONGV);bank.push({prompt:`Which one is the LONG “${esc(t.tr)}”?`,speakAr:t.ar,answer:t.ar,options:shuffle([t.ar,t.short]).map(o=>({key:o,html:optAr(o)}))})}
    if(ls.type==="shadda"){const t=pick(SHADDA);bank.push(qSyl({...t,say:t.ar},SHADDA))}
    if(ls.type==="words"){const ws=WORDS[ls.set];bank.push(qReadPic(pick(ws),ws),qHearPic(pick(ws),ws))}
    if(ls.type==="phrases"){const p=pick(WORDS.phrases);bank.push({prompt:`What do we say ${esc(p.when)}?`,answer:p.ar,options:shuffle([p,...shuffle(WORDS.phrases.filter(x=>x!==p)).slice(0,NOPT())]).map(o=>({key:o.ar,html:`<span class="ar" style="font-size:34px">${o.ar}</span><small>${esc(o.tr)}</small>`}))})}
  });
  return shuffle(bank).slice(0,AGE().quizN);
}

function runSteps({steps,title,onExit,onFinish,quiz=false}){
  let idx=0,miss=0,hits=0,clean=[];
  APP().innerHTML=`<div class="lessonbar"><button class="iconbtn" data-x aria-label="Leave">✕</button><div class="progress"><i style="width:0"></i></div><span class="pill" style="font-size:16px;padding:4px 12px">${esc(title)}</span></div><div class="stage"></div>`;
  const stage=$(".stage"),bar=$(".progress i");
  const cleanup=()=>{clean.forEach(f=>{try{f()}catch(e){}});clean=[]};CLEAN.push(cleanup);
  const api={next:()=>{cleanup();stopSpeech();idx++;show()},miss:(a)=>{miss++;if(a)recordLetter(a,false)},hit:(a,first)=>{if(first)hits++;if(a&&first)recordLetter(a,true)},onCleanup:f=>clean.push(f)};
  function show(){bar.style.width=(idx/steps.length*100)+"%";if(idx>=steps.length){onFinish({miss,hits});return}const[type,p]=steps[idx];const el=document.createElement("div");el.style.width="100%";el.style.display="flex";stage.innerHTML="";stage.appendChild(el);stage.scrollTop=0;
    try{ACT[type](el,p,api)}catch(e){console.error(e);api.next()}const a=$(".act",el);if(a)a.style.margin="auto"}
  $("[data-x]").onclick=async()=>{if(await ask("Leave this lesson?","Your progress in this lesson won't be saved.","Leave","Keep learning")){cleanup();onExit()}};
  show();
}
function startLesson(mi,i){
  const mp=MAPS[mi],ls=mp.lessons[i],id=`${mp.id}-${i}`;const k=kid();
  runSteps({steps:buildLesson(mp,i),title:lessonTitle(ls),onExit:()=>go("map",mi),onFinish:({miss})=>{
    const stars=miss<=2?3:miss<=5?2:1;const first=!k.done[id];k.done[id]=Date.now();logAct("lessons");k.stars[id]=Math.max(k.stars[id]||0,stars);
    let creature=null;if(first){const left=CREATURES.filter(c=>!k.creatures.includes(c.name));if(left.length){creature=left[0];k.creatures.push(creature.name)}}save();
    const el=$(".stage");el.innerHTML="";const d=document.createElement("div");d.style.cssText="width:100%;display:flex";el.appendChild(d);$(".progress i").style.width="100%";
    ACT.reward(d,{earned:(first?10:3)+(stars===3?2:0),creature,stars,title:`${lessonTitle(ls)}: done!`},{next:()=>go("map",mi)});
  }});
}
function startQuiz(mi){
  const mp=MAPS[mi];const k=kid();const qs=buildQuiz(mp);let right=0;const N=qs.length,PASS=Math.min(N,Math.round(AGE().pass/AGE().quizN*N));
  const steps=[["info",{speech:`Time for the <b>${esc(mp.name)}</b> quiz! Get ${PASS} out of ${N} to win the trophy.`,title:"Stage Quiz 🏆",nextLabel:"Start",intro:`Time for the ${mp.name} quiz! Get ${PASS} out of ${N} to win the trophy.`}],...qs.map(q=>["quizq",{q,onAnswer:ok=>{if(ok)right++}}])];
  runSteps({steps,title:`${mp.name} Quiz`,quiz:true,onExit:()=>go("map",mi),onFinish:()=>{
    const pass=right>=PASS;const was=quizPassed(k,mp.id);k.quiz[mp.id]=Math.max(k.quiz[mp.id]||0,right);(k.exams=k.exams||[]).push({d:Date.now(),id:"stage-"+mp.id,name:`${mp.name} quiz`,score:right,n:N});logAct("exams");
    if(pass&&!was){k.certs=k.certs||{};k.certs[mp.id]=Date.now();k.quizPass[mp.id]=true;k.quizScore[mp.id]=`${right} / ${N}`}save();const prevBest=was?99:0;
    const el=$(".stage");el.innerHTML=`<div class="act">${speechHTML(pass?`Mā shāʾ Allāh! You scored <b>${right} / ${N}</b>!`:`You scored <b>${right} / ${N}</b>. Let's practise and try again. You can do it!`,pass?"wow":"think",90)}
      <div style="font-size:120px">${pass?"🏆":"💪"}</div>
      ${pass&&!was?`<div class="earn">+30 <span class="pearl"></span> gold dinars</div>`:""}
      <div class="row center">${pass?`<button class="btn plum" data-cert>📜 See my certificate</button>`:`<button class="btn coral" data-retry>↺ Try again</button>`}<button class="btn sun" data-map>${pass?"🐪 Travel on!":"🗺️ Back to map"}</button></div></div>`;
    $(".act",el).style.margin="auto";
    if(pass){confetti(200);SFX.fanfare();if(!was)pearls(30,`Trophy: ${mp.name}`)}else SFX.bad();
    const c=$("[data-cert]",el);if(c)c.onclick=()=>go("cert",mp.id,()=>go("journey"));
    const r=$("[data-retry]",el);if(r)r.onclick=()=>startQuiz(mi);
    $("[data-map]",el).onclick=()=>pass?go("journey"):go("map",mi);
    sayEn(pass?`Masha Allah! You scored ${right} out of ${N}!`:`You scored ${right}. Let's practise and try again!`);
  }});
}
// quiz question: one try only, then move on
ACT.quizq=(el,{q,onAnswer},api)=>{
  ACT.choose(el,{rounds:[{...q,onRight:null}]},{...api,miss:a=>{api.miss(a)},hit:(a,f)=>{api.hit(a,f)},next:api.next});
  // override: first tap decides
  $$(".choice",el).forEach(b=>{const orig=b.onclick;b.onclick=()=>{if(el.dataset.answered)return;el.dataset.answered=1;const ok=b.dataset.k===String(q.answer);onAnswer(ok);if(q.letter)recordLetter(q.letter,ok);
    if(ok){b.classList.add("good");SFX.good();praise()}else{b.classList.add("bad");SFX.bad();const g=$$(".choice",el).find(x=>x.dataset.k===String(q.answer));if(g)g.classList.add("good")}
    setTimeout(api.next,ok?900:1600)}});
};

function seeded(seed){let x=seed;return()=>((x=Math.imul(x^x>>>15,2246822507)^Math.imul(x^x>>>13,3266489909))>>>0)/4294967296}
function bb(x,y,inner,cls="",attrs=""){return `<div class="bb ${cls}" style="left:${x}px;top:${y}px" ${attrs}><div class="bbi">${inner}</div></div>`}

// ---------- camera ----------
function camera(world,plane,tilt,zf=1,zmin=.62){
  const st={fx:0,fy:0,z:1,minY:0,maxY:1000,minX:0,maxX:1000};
  st.apply=()=>{const vw=world.clientWidth,vh=world.clientHeight;st.z=Math.max(zmin,Math.min(1.05*zf,vw/980*zf));plane.style.transformOrigin=`${st.fx}px ${st.fy}px`;plane.style.transform=`translate3d(${vw/2-st.fx}px,${vh*.58-st.fy}px,0) rotateX(${tilt}deg) scale(${st.z})`};
  st.look=(x,y)=>{st.fx=Math.max(st.minX,Math.min(st.maxX,x));st.fy=Math.max(st.minY,Math.min(st.maxY,y));st.apply()};
  let drag=null,moved=false;
  world.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,fx:st.fx,fy:st.fy};moved=false});
  const mv=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;if(moved){world.classList.add("dragging");st.look(drag.fx-dx/st.z,drag.fy-dy*1.7/st.z)}};
  const up=()=>{drag=null;world.classList.remove("dragging")};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
  world.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  world.addEventListener("wheel",e=>{e.preventDefault();st.look(st.fx+e.deltaX/st.z,st.fy+e.deltaY*1.5/st.z)},{passive:false});
  const ro=()=>st.apply();addEventListener("resize",ro);
  CLEAN.push(()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);removeEventListener("resize",ro)});
  return st;
}
// walk an element along points with the camera following
function walk(pts,{onStep,dur=1400}){return new Promise(res=>{let alive=true;CLEAN.push(()=>{alive=false});const segs=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);tot+=d}
  const t0=performance.now();const D=Math.max(600,Math.min(dur*(tot/260),7000));let lastStep=0;
  (function f(t){if(!alive)return res();let u=Math.min(1,(t-t0)/D);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;let d=u*tot,i=0;while(i<segs.length-1&&d>segs[i]){d-=segs[i];i++}const k=segs[i]?d/segs[i]:1;
    const x=pts[i][0]+(pts[i+1]?pts[i+1][0]-pts[i][0]:0)*k,y=pts[i][1]+(pts[i+1]?pts[i+1][1]-pts[i][1]:0)*k;onStep(x,y,t);
    if(t-lastStep>260){lastStep=t;tone(500+Math.random()*80,.04,"sine",.05)}
    if(u<1)requestAnimationFrame(f);else res()})(t0)})}
function footprint(plane,x,y){const f=h(`<div class="bb foot" style="left:${x}px;top:${y}px"><div class="bbi">👣</div></div>`);plane.appendChild(f);setTimeout(()=>f.remove(),2600)}
function bez(p0,p1,steps=16){const my=(p0[1]+p1[1])/2;const c1=[p0[0],my],c2=[p1[0],my];const out=[];for(let s=0;s<=steps;s++){const t=s/steps,u=1-t;out.push([u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p1[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p1[1]])}return out}

function arcadeLetters(){const k=kid();const done=new Set();MAPS.slice(0,4).forEach(mp=>mp.lessons.forEach((ls,i)=>{if(k.done[`${mp.id}-${i}`])done.add(ls.letter)}));

  </div></div>`;

function playArcade(g){

// ================= LETTER GAMES: Word Search · Letter Snake =================
const plainAr=w=>w.replace(/[ً-ْٰ]/g,"");
function lgWords(maxLen,minLen=2){const all=Object.entries(WORDS).filter(([k])=>k!=="phrases").flatMap(([,v])=>v);const seen=new Set();
  return shuffle(all).filter(w=>{const p=[...plainAr(w.ar)];if(p.length<minLen||p.length>maxLen||seen.has(p.join("")))return false;seen.add(p.join(""));return true})}

// ---- Word Search (grid reads right-to-left) ----
ACT.wordsearch=(el,_,api)=>{
  const age=AGE().id;const N={seeds:5,explorers:6,adventurers:7,scholars:8}[age]||6,NW={seeds:3,explorers:4,adventurers:5,scholars:5}[age]||4;

    for(const w of lgWords(N)){if(placed.length>=NW)break;const L2=[...plainAr(w.ar)];let ok=false;
      for(let t=0;t<120&&!ok;t++){const[dc,dr]=pick(dirs);const r0=Math.random()*(N-dr*(L2.length-1))|0,c0=Math.random()*(N-dc*(L2.length-1))|0;
        if(L2.every((ch,i)=>{const g=grid[r0+dr*i][c0+dc*i];return g===""||g===ch})){const cells=L2.map((ch,i)=>{grid[r0+dr*i][c0+dc*i]=ch;return[r0+dr*i,c0+dc*i]});placed.push({w,L:L2,cells,found:false});ok=true}}}
    if(placed.length>=Math.min(NW,3))break}
  const fillers=LETTERS.map(x=>x.ar);grid.forEach(row=>row.forEach((v,i)=>{if(!v)row[i]=pick(fillers)}));
  const hues=["#ffcf3f","#7fe0a0","#8fd3ff","#ffa8c8","#c9b0ff","#ffb37a"];
  el.innerHTML=`<div class="act"><div class="prompt">🔠 Find the hidden words!</div><p class="sub">Words go <b>right ⬅ left</b> and <b>top ⬇ down</b>${dirs.length>2?" and diagonally":""}. Drag across a word, or tap its first and last letter.</p>
    <div class="wsbox"><div class="ws" dir="rtl" style="--n:${N}">${grid.map((row,r)=>row.map((ch,c)=>`<div class="wsc" data-r="${r}" data-c="${c}"><span class="ar">${ch}</span></div>`).join("")).join("")}</div>
    <div class="wslist">${placed.map((p,i)=>`<button class="wsw" data-w="${i}"><span class="emo">${p.w.emo}</span><span class="ar">${p.w.ar}</span><small>${esc(p.w.en)}${age==="seeds"?` · <span class="ar" dir="rtl">${p.L.join(" ")}</span>`:""}</small></button>`).join("")}</div></div></div>`;
  const box=$(".ws",el),cell=(r,c)=>$(`.wsc[data-r="${r}"][data-c="${c}"]`,box);let start=null,cur=[],anchor=null,dragging=false;
  const line=(a,b)=>{const dr=b[0]-a[0],dc=b[1]-a[1];if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return null;const n=Math.max(Math.abs(dr),Math.abs(dc));const sr=Math.sign(dr),sc=Math.sign(dc);return Array.from({length:n+1},(_,i)=>[a[0]+sr*i,a[1]+sc*i])};
  const paint=cs=>{$$(".wsc.sel",box).forEach(x=>x.classList.remove("sel"));(cs||[]).forEach(([r,c])=>cell(r,c).classList.add("sel"))};
  const at=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest(".wsc");return c&&box.contains(c)?[+c.dataset.r,+c.dataset.c]:null};
  function check(cs){paint(null);if(!cs||cs.length<2)return false;const key=cs.map(([r,c])=>r+","+c).join("|"),rkey=[...cs].reverse().map(([r,c])=>r+","+c).join("|");
    const p=placed.find(p=>!p.found&&(p.cells.map(([r,c])=>r+","+c).join("|")===key||p.cells.map(([r,c])=>r+","+c).join("|")===rkey)||(!p.found&&cs.map(([r,c])=>grid[r][c]).join("")===p.L.join("")));
    if(!p){SFX.bad();api.miss(null);cs.forEach(([r,c])=>{const x=cell(r,c);x.classList.remove("bad");void x.offsetWidth;x.classList.add("bad")});return true}
    p.found=true;const hue=hues[placed.indexOf(p)%hues.length];cs.forEach(([r,c])=>{const x=cell(r,c);x.classList.add("found");x.style.setProperty("--fh",hue)});$(`[data-w="${placed.indexOf(p)}"]`,el).classList.add("done");
    SFX.good();api.hit(null,true);sayAr(p.w.ar);if(placed.every(q=>q.found)){praise();confetti(100);setTimeout(api.next,1600)}return true}
  box.addEventListener("pointerdown",e=>{const c=at(e);if(!c)return;e.preventDefault();dragging=true;start=c;cur=[c];paint(cur)});
  box.addEventListener("pointermove",e=>{if(!dragging)return;const c=at(e);if(!c)return;const ln=line(start,c);if(ln){cur=ln;paint(anchor?line(anchor,c)||cur:cur)}});
  const up=e=>{if(!dragging)return;dragging=false;const c=at(e)||cur[cur.length-1];

  addEventListener("pointerup",up);api.onCleanup(()=>removeEventListener("pointerup",up));

// ---- Letter Snake ----
ACT.snake=(el,{onScore},api)=>{
  const age=AGE().id;const COLS=age==="seeds"?10:12,ROWS=age==="seeds"?7:8;const STEP=Math.round(300/AGE().speed);const HEARTS=age==="seeds"?5:3;const TIME=90;
  const words=lgWords(age==="seeds"?3:4);let wi=0,word,need=0;
  el.innerHTML=`<div class="act snakeact"><div class="snbar"><span class="hchip2">❤️ <b data-h>${HEARTS}</b></span><div class="snword" dir="rtl"></div><span class="hchip2">⏱ <b data-t>${TIME}</b></span></div>
    <canvas class="sncv"></canvas>
    <div class="dpad"><button data-d="0,-1" aria-label="Up">▲</button><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div>
    <p class="sub" style="text-align:center;margin:0">Eat the letters <b>in order</b> (right ⬅ left) to spell the word. Swipe, use the arrows, or the buttons.</p></div>`;
  const cv=$(".sncv",el),ctx=cv.getContext("2d");let cs=30,dpr=1;
  function size(){const w=Math.min(el.clientWidth-8,760),hMax=Math.max(220,innerHeight-330);cs=Math.floor(Math.min(w/COLS,hMax/ROWS));dpr=Math.min(2,devicePixelRatio||1);cv.width=COLS*cs*dpr;cv.height=ROWS*cs*dpr;cv.style.width=COLS*cs+"px";cv.style.height=ROWS*cs+"px"}
  let snake=[[3,3],[2,3],[1,3]],dir=[1,0],nextDir=[1,0],items=[],hearts=HEARTS,score=0,alive=true,grow=0,flash=0;const t0=Date.now();
  const free=()=>{for(let t=0;t<200;t++){const p=[Math.random()*COLS|0,Math.random()*ROWS|0];if(!snake.some(s=>s[0]===p[0]&&s[1]===p[1])&&!items.some(i=>i.x===p[0]&&i.y===p[1])&&Math.abs(p[0]-snake[0][0])+Math.abs(p[1]-snake[0][1])>2)return p}return[0,0]};
  function newWord(){word=words[wi++%words.length];need=0;wordBar();sayAr(word.ar);spawn()}
  function wordBar(){const L2=[...plainAr(word.ar)];$(".snword",el).innerHTML=`<span class="emo">${word.emo}</span>${L2.map((ch,i)=>`<b class="${i<need?"got":i===need?"nx":""}">${ch}</b>`).join("")}<small dir="ltr">${esc(word.en)}</small>`}
  function spawn(){items=[];const L2=[...plainAr(word.ar)];const want=L2[need];const decoys=shuffle(LETTERS.map(x=>x.ar).filter(a=>a!==want&&baseOf(a)!==baseOf(want))).slice(0,age==="seeds"?2:3);
    [want,...decoys].forEach(ch=>{const[x,y]=free();items.push({x,y,ch,ok:ch===want})})}
  function lose(msg){hearts--;$("[data-h]",el).textContent=hearts;SFX.bad();flash=8;api.miss(null);if(msg)toast(msg,1400);if(hearts<=0)end()}
  function tick(){if(!alive)return;dir=nextDir;const h=[(snake[0][0]+dir[0]+COLS)%COLS,(snake[0][1]+dir[1]+ROWS)%ROWS];
    const hitSelf=snake.findIndex((s,i)=>i<snake.length-1&&s[0]===h[0]&&s[1]===h[1]);
    snake.unshift(h);if(grow>0)grow--;else snake.pop();
    if(hitSelf>0){snake=snake.slice(0,Math.max(3,hitSelf));lose("Oops! You bumped into yourself.")}
    const it=items.find(i=>i.x===h[0]&&i.y===h[1]);
    if(it){if(it.ok){need++;score++;onScore&&onScore(score);grow+=1;SFX.coin();api.hit(null,true);const L2=[...plainAr(word.ar)];
        if(need>=L2.length){wordBar();praise();SFX.good();sayAr(word.ar);setTimeout(()=>{if(alive)newWord()},900);items=[]}else{wordBar();spawn();sayAr(L[L2[need-1]]?.nameAr||L2[need-1])}}
      else{items=items.filter(i=>i!==it);lose(`That's ${L[it.ch]?.name||it.ch}. Find ${L[[...plainAr(word.ar)][need]]?.name||"the next letter"}!`);if(alive){const[x,y]=free();items.push({x,y,ch:it.ch,ok:false})}}}
    draw()}

// ================= QUR'AN GARDEN (word-by-word highlighting from real timings) =================
// Word timings come from the Qur'an.com word segmentation for this same Alafasy recording,
// re-aligned to the local audio files. Highlighting follows the actual voice, at any speed.
const QPREF={repeat:1,echo:false,rate:1};
const BISM={words:["بِسْمِ","ٱللَّهِ","ٱلرَّحْمَـٰنِ","ٱلرَّحِيمِ"],get t(){return SURAHS.find(s=>s.n===1).ayat[0].t}};
// play one ayah, lighting each word red exactly while it is recited
function playAyahWords(surah,ayah,wordEls,times,ctl){
  stopSpeech();stopAyah();
  const f=String(surah).padStart(3,"0")+String(ayah).padStart(3,"0");
  const a=new Audio("audio/"+f+".mp3");AUD=a;a.playbackRate=QPREF.rate;try{a.preservesPitch=true;a.mozPreservesPitch=true;a.webkitPreservesPitch=true}catch(e){}
  if(ctl)ctl.audio=a;
  let raf;
  const clear=()=>wordEls.forEach(w=>w.classList.remove("now","read"));
  const tick=()=>{if(AUD!==a)return;const ct=a.currentTime;let idx=-1;
      for(let i=0;i<times.length;i++){if(ct>=times[i][0]-.04)idx=i}
      if(idx>=0&&ct>times[idx][1]+.25&&idx===times.length-1)idx=times.length; // finished
      wordEls.forEach((w,i)=>{w.classList.toggle("now",i===idx);w.classList.toggle("read",i<idx)});
    raf=requestAnimationFrame(tick)};
  return new Promise(res=>{
    let done=false;const fin=ok=>{if(done)return;done=true;cancelAnimationFrame(raf);if(ok){wordEls.forEach(w=>{w.classList.remove("now");w.classList.add("read")});setTimeout(clear,450)}else clear();res(ok)};
    a.onended=()=>fin(true);a.onerror=()=>{toast("Couldn't play this ayah.");fin(false)};
    a.addEventListener("pause",()=>{if(AUD!==a)fin(false)});
    if(ctl){ctl.pause=()=>{a.pause();cancelAnimationFrame(raf)};ctl.resume=()=>{a.playbackRate=QPREF.rate;a.play().then(()=>{raf=requestAnimationFrame(tick)}).catch(()=>{})};ctl.kill=()=>{a.pause();if(AUD===a)AUD=null;fin(false)}}
    a.play().then(()=>{raf=requestAnimationFrame(tick)}).catch(()=>fin(false));
  });
}

SCREENS.surah=(n)=>{

  const icon=(a,t)=>{const b=$(`[data-p="${a}"]`);if(b)b.textContent=t};
  const mark=a=>{$$(".ayah").forEach(x=>x.classList.toggle("playing",+x.dataset.a===a));$$(".ab").forEach(b=>b.textContent="▶");const el=$(`.ayah[data-a="${a}"]`);if(el){icon(a,"⏸");el.scrollIntoView({block:"center",behavior:"smooth"})}};
  const reset=a=>{const el=$(`.ayah[data-a="${a}"]`);if(!el)return;$$(".w",el).forEach(w=>w.classList.remove("now","read"));el.classList.remove("yourturn","playing");const rc=$("[data-rc]",el);if(rc)rc.textContent="";icon(a,"▶")};
  async function playOne(a,my){
    const el=$(`.ayah[data-a="${a}"]`);const wEls=$$(".w",el);const reps=a===0?1:QPREF.repeat;const rc=$("[data-rc]",el);const ay=a===0?BISM:s.ayat.find(x=>x.a===a);
